substitutions:
  device_name: "Fan Controller NAS"
  espname: "fan-controller-nas"

  # Final PCB pin mapping.
  fan1_pwm_pin: GPIO39
  fan1_tach_pin: GPIO40
  fan2_pwm_pin: GPIO37
  fan2_tach_pin: GPIO38
  fan3_pwm_pin: GPIO35
  fan3_tach_pin: GPIO36
  fan4_pwm_pin: GPIO33
  fan4_tach_pin: GPIO34
  fan5_pwm_pin: GPIO21
  fan5_tach_pin: GPIO1
  fan6_pwm_pin: GPIO2
  fan6_tach_pin: GPIO3
  temp_sens_pin: GPIO4
  v12_sense_pin: GPIO17
  i2c_sda_pin: GPIO13
  i2c_scl_pin: GPIO14

  # Shared fan disturbance/recovery settings.
  # A disturbance is only an underspeed condition. Overspeed is ignored.
  fan_minimum_rpm_ratio: "0.65"
  fan_disturbance_delay: "15s"
  fan_recovery_attempts: "5"
  fan_recovery_off_time: "5s"
  fan_recovery_settle_time: "15s"

  # Two-point quick calibration settings.
  fan_calibration_pwm_low: "20"
  fan_calibration_pwm_high: "80"

esphome:
  name: "${espname}"
  friendly_name: "${device_name}"
  comment: "ESP32-S2 6x PWM fan controller"
  platformio_options:
    board_build.f_flash: 40000000L
    board_build.flash_mode: dio
    board_build.flash_size: 4MB
    board_build.extra_flags:
      - "-DARDUINO_USB_CDC_ON_BOOT=0"

esp32:
  board: lolin_s2_mini
  variant: ESP32S2
  framework:
    type: esp-idf

packages:
  wifi: !include common/wifi.yaml
  network_diagnostics: !include common/network_diagnostics.yaml
  base_config: !include common/base_config.yaml

  fan_1_hardware: !include
    file: templates/fan_functions/pwm_fan.yaml
    vars:
      fan_name: "NAS Fan 1"
      fan_id: fan_1
      fan_output_id: fan_output_1
      tach_sensor_id: fanspeed_sensor_1
      pwm_pin: ${fan1_pwm_pin}
      tach_pin: ${fan1_tach_pin}
      ledc_channel: "0"

  fan_2_hardware: !include
    file: templates/fan_functions/pwm_fan.yaml
    vars:
      fan_name: "NAS Fan 2"
      fan_id: fan_2
      fan_output_id: fan_output_2
      tach_sensor_id: fanspeed_sensor_2
      pwm_pin: ${fan2_pwm_pin}
      tach_pin: ${fan2_tach_pin}
      ledc_channel: "1"

  fan_3_hardware: !include
    file: templates/fan_functions/pwm_fan.yaml
    vars:
      fan_name: "NAS Fan 3"
      fan_id: fan_3
      fan_output_id: fan_output_3
      tach_sensor_id: fanspeed_sensor_3
      pwm_pin: ${fan3_pwm_pin}
      tach_pin: ${fan3_tach_pin}
      ledc_channel: "2"

  fan_4_hardware: !include
    file: templates/fan_functions/pwm_fan.yaml
    vars:
      fan_name: "NAS Fan 4"
      fan_id: fan_4
      fan_output_id: fan_output_4
      tach_sensor_id: fanspeed_sensor_4
      pwm_pin: ${fan4_pwm_pin}
      tach_pin: ${fan4_tach_pin}
      ledc_channel: "3"

  fan_5_hardware: !include
    file: templates/fan_functions/pwm_fan.yaml
    vars:
      fan_name: "NAS Fan 5"
      fan_id: fan_5
      fan_output_id: fan_output_5
      tach_sensor_id: fanspeed_sensor_5
      pwm_pin: ${fan5_pwm_pin}
      tach_pin: ${fan5_tach_pin}
      ledc_channel: "4"

  fan_6_hardware: !include
    file: templates/fan_functions/pwm_fan.yaml
    vars:
      fan_name: "NAS Fan 6"
      fan_id: fan_6
      fan_output_id: fan_output_6
      tach_sensor_id: fanspeed_sensor_6
      pwm_pin: ${fan6_pwm_pin}
      tach_pin: ${fan6_tach_pin}
      ledc_channel: "5"

  # Fan 1-3 are connected and calibrated. Their 20/80% calibration points are
  # from the August 2026 calibration run. Detection remains enabled down to 10%
  # because the full run confirmed the linear model is still accurate there.
  fan_1_health: !include
    file: templates/fan_functions/fan_health.yaml
    vars:
      fan_name: "NAS Fan 1"
      fan_id: fan_1
      tach_sensor_id: fanspeed_sensor_1
      calibration_pwm_low: ${fan_calibration_pwm_low}
      calibration_rpm_low: "833.3"
      calibration_pwm_high: ${fan_calibration_pwm_high}
      calibration_rpm_high: "2447.5"
      monitor_min_pwm: "10"
      minimum_rpm_ratio: ${fan_minimum_rpm_ratio}
      disturbance_delay: ${fan_disturbance_delay}
      recovery_attempts: ${fan_recovery_attempts}
      recovery_off_time: ${fan_recovery_off_time}
      recovery_settle_time: ${fan_recovery_settle_time}
      notification_id_prefix: "${espname}_fan_fault"

  fan_2_health: !include
    file: templates/fan_functions/fan_health.yaml
    vars:
      fan_name: "NAS Fan 2"
      fan_id: fan_2
      tach_sensor_id: fanspeed_sensor_2
      calibration_pwm_low: ${fan_calibration_pwm_low}
      calibration_rpm_low: "827.9"
      calibration_pwm_high: ${fan_calibration_pwm_high}
      calibration_rpm_high: "2438.8"
      monitor_min_pwm: "10"
      minimum_rpm_ratio: ${fan_minimum_rpm_ratio}
      disturbance_delay: ${fan_disturbance_delay}
      recovery_attempts: ${fan_recovery_attempts}
      recovery_off_time: ${fan_recovery_off_time}
      recovery_settle_time: ${fan_recovery_settle_time}
      notification_id_prefix: "${espname}_fan_fault"

  fan_3_health: !include
    file: templates/fan_functions/fan_health.yaml
    vars:
      fan_name: "NAS Fan 3"
      fan_id: fan_3
      tach_sensor_id: fanspeed_sensor_3
      calibration_pwm_low: ${fan_calibration_pwm_low}
      calibration_rpm_low: "828.0"
      calibration_pwm_high: ${fan_calibration_pwm_high}
      calibration_rpm_high: "2442.0"
      monitor_min_pwm: "10"
      minimum_rpm_ratio: ${fan_minimum_rpm_ratio}
      disturbance_delay: ${fan_disturbance_delay}
      recovery_attempts: ${fan_recovery_attempts}
      recovery_off_time: ${fan_recovery_off_time}
      recovery_settle_time: ${fan_recovery_settle_time}
      notification_id_prefix: "${espname}_fan_fault"

  nas_disk_fan_control: !include
    file: templates/fan_functions/nas_disk_fan_control.yaml
    vars:
      controlled_fan_1_id: fan_1
      controlled_fan_2_id: fan_2
      controlled_fan_3_id: fan_3

# wifi:
