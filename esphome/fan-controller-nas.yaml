# Disabled intentionally:
# GPIO15 is one of the XTAL_32K-labelled pins on the Wemos S2 Mini.
# If you really want the onboard/status LED and accept using GPIO15, enable this again.
#
# status_led:
#   pin: GPIO15

i2c:
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  scan: true

one_wire:
  - platform: gpio
    id: one_wire_bus
    pin: ${temp_sens_pin}

sensor:
  # ---------------------------------------------------------------------------
  # 12V rail monitor
  #
  # Hardware divider assumed:
  #   +12V -> 91k -> ADC node -> 10k -> GND
  #
  # Calibrated on 20260620 with adapter multiplier 11.1.
  # ---------------------------------------------------------------------------
  - platform: adc
    name: "NAS Fan Controller 12V Rail"
    id: v12_rail_voltage
    pin: ${v12_sense_pin}
    attenuation: 6db
    update_interval: 5s
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 11.1
      - or:
          - throttle_average: 60s
          - delta: 1

