substitutions:
  temperature_multiplier: "1.0"
  temperature_offset: "-1.5"
  pressure_multiplier: "1.0"
  pressure_offset: "0.0"
  humidity_multiplier: "1.0"
  humidity_offset: "0.0"

sensor:
  - platform: bme280_i2c
    address: 0x76
    update_interval: 10s
    iir_filter: 4x
    temperature:
      name: "${location} AQM Raw Temperature"
      id: raw_temp
      internal: true
      unit_of_measurement: "°C"
      device_class: "temperature"
      accuracy_decimals: 2
      oversampling: 16x
    pressure:
      name: "${location}  AQM Pressure"
      icon: mdi:gauge
      id: press
      unit_of_measurement: "hPa"
      device_class: "pressure"
      accuracy_decimals: 1
      oversampling: 16x
      filters:
        - multiply: ${pressure_multiplier}
        - offset: ${pressure_offset}
        - or:
            - throttle_average: 60s
            - delta: 10
        - round: 1
    humidity:
      name: "${location} AQM Raw Humidity"
      id: raw_hum
      internal: true
      unit_of_measurement: "%"
      device_class: "humidity"
      accuracy_decimals: 1
      oversampling: 16x

  - platform: template
    name: "${location} AQM Temperature"
    icon: mdi:thermometer
    id: temp
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      if (!id(raw_temp).has_state()) {
        return NAN;
      }

      return id(raw_temp).state * ${temperature_multiplier} + ${temperature_offset};
    filters:
      - or:
          - throttle_average: 60s
          - delta: 1.0
      - round: 2
  - platform: template
    name: "${location} AQM Humidity"
    icon: mdi:water-percent
    id: hum
    unit_of_measurement: "%"
    device_class: "humidity"
    state_class: "measurement"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      if (!id(raw_temp).has_state() || !id(raw_hum).has_state()) {
        return NAN;
      }

      const float t_raw = id(raw_temp).state;
      const float rh_raw = id(raw_hum).state;
      const float t_corr = t_raw * ${temperature_multiplier} + ${temperature_offset};

      // Saturation vapour pressure using Magnus formula.
      // Temperature in °C. Result is in hPa, but only the ratio is used.
      const float es_raw = 6.112f * expf((17.62f * t_raw) / (243.12f + t_raw));
      const float es_corr = 6.112f * expf((17.62f * t_corr) / (243.12f + t_corr));

      if (es_corr <= 0.0f) {
        return NAN;
      }

      // Convert RH measured at the warmed sensor temperature to RH at the
      // corrected ambient temperature, assuming absolute moisture content is unchanged.
      float rh_corr = rh_raw * es_raw / es_corr;

      // Optional final humidity calibration after temperature compensation.
      rh_corr = rh_corr * ${humidity_multiplier} + ${humidity_offset};

      // Clamp to physical range. Boring, but prevents ugly HA graphs.
      if (rh_corr < 0.0f) {
        rh_corr = 0.0f;
      } else if (rh_corr > 100.0f) {
        rh_corr = 100.0f;
      }

      return rh_corr;
    filters:
      - or:
          - throttle_average: 60s
          - delta: 5
      - round: 1

  - platform: absolute_humidity
    name: "${location} AQM Absolute Humidity"
    id: abs_hum
    icon: mdi:water
    temperature: temp
    humidity: hum
    equation: Wobus
    unit_of_measurement: "g/m³"
    accuracy_decimals: 2
    state_class: "measurement"
    entity_category: "diagnostic"
    filters:
      - or:
          - throttle_average: 60s
          - delta: 0.5
      - round: 2
