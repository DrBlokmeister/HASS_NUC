##################
#    SWITCHES    #
##################
switch:
  platform: wake_on_lan
  name: BlokmeisterNAS
  host: 10.0.0.250
  mac: "BC:5F:F4:8B:7A:9E"
  turn_off:
    service: rest_command.nas_shutdown
#####################
#    AUTOMATIONS    #
#####################
automation:
  - alias: "[system|network]Enter Work Zone - Start Containers"
    id: yaml_automation_system_network_enter_work_zone_start_containers
    description: "Turns on NPM and Firefox + authentication containers when entering work zone."
    mode: single
    trigger:
      - platform: zone
        entity_id: person.sander_blok
        zone: zone.work
        event: enter
      - platform: state
        entity_id:
          - device_tracker.worklaptop_dock
          - device_tracker.worklaptop_wifi
          - device_tracker.worklaptop_wifi_hp
          - device_tracker.worklaptop
        from: "not_home"
        to: "home"
        for:
          minutes: 2
      #can also be used to trigger container start/stop
      # - platform: state
      #   entity_id: device_tracker.worklaptop_wifi
      #   to: home
      # - platform: state
      #   entity_id: device_tracker.worklaptop_dock
      #   to: home
    action:
      - service: switch.turn_on
        target:
          entity_id:
            - switch.docker_tower_authelia
            - switch.docker_tower_apacheguacamole
            - switch.docker_tower_firefox
            - switch.docker_tower_nginx_proxy_manager_official
            # - switch.network_port_forwarding_nginx_proxy_manager
            # - switch.network_port_forwarding_nginx_proxy_manager_https
      - wait_for_trigger:
          - platform: zone
            entity_id: person.sander_blok
            zone: zone.work
            event: leave
          - platform: template
            value_template: "{{ is_state('device_tracker.worklaptop', 'not_home') and is_state('device_tracker.worklaptop_dock', 'not_home') and is_state('device_tracker.worklaptop_wifi', 'not_home') and is_state('device_tracker.worklaptop_wifi_hp', 'not_home') }}"
            for:
              minutes: 15
        timeout:
          hours: 12
        continue_on_timeout: false
      - service: switch.turn_off
        entity_id:
          - switch.docker_tower_authelia
          - switch.docker_tower_apacheguacamole
          - switch.docker_tower_firefox
          - switch.docker_tower_nginx_proxy_manager_official
          # - switch.network_port_forwarding_nginx_proxy_manager
          # - switch.network_port_forwarding_nginx_proxy_manager_https

  - alias: "[system|network]Query NAS sensors"
    mode: single
    description: "Automatically queries the sensors in the NAS using a bash script every minute."
    trigger:
      - platform: time_pattern
        minutes: "/5"
    action:
      - service: shell_command.execute_nas_monitor_commands
      - delay:
          seconds: 30
      - service: homeassistant.update_entity
        data:
          entity_id:
            - binary_sensor.nas_ssh_reachability
            - switch.nas_unraid_array
            - switch.nas_wireguard_service

  - alias: '[system|nas]Completed Torrent Notification'
    id: yaml_automation_system_nas_completed_torrent_notification
    trigger:
      platform: event
      event_type: transmission_downloaded_torrent
    action:
      service: notify.mobile_app_blokmeisterp9pro
      data:
        title: "Torrent completed!"
        message: "{{ trigger.event.data.name }} has finished downloading!"
        data:
          ttl: 0
          priority: high
          sticky: "true"
          group: reminder
          tag: transmission
          icon_url: "https://upload.wikimedia.org/wikipedia/commons/6/6d/Transmission_icon.png"
          timeout: 1800

  # - alias: "[system|nas]Link Speed Alert"
  #   trigger:
  #     - platform: numeric_state
  #       entity_id: sensor.nas_link_speed
  #       below: 9000
  #       for:
  #         minutes: 10
  #   action:
  #     - service: persistent_notification.create
  #       data:
  #         title: "Network Speed Alert"
  #         message: "Warning: Network speed has dropped below 9000 Mb/s."
  #         notification_id: "network_speed_alert"
  #     - wait_for_trigger:
  #         - platform: numeric_state
  #           entity_id: sensor.nas_link_speed
  #           above: 9000
  #     - service: persistent_notification.dismiss
  #       data:
  #         notification_id: "network_speed_alert"

  - alias: "[system|nas] Notify on Plex log errors"
    id: yaml_automation_system_nas_notify_on_plex_log_errors
    description: "Sends a mobile notification when Plex log sensors detect errors or SQLITE mentions."
    mode: single
    trigger:
      # - platform: numeric_state
      #   entity_id: sensor.plex_log_error_entries
      #   above: 0
      - platform: numeric_state
        entity_id: sensor.plex_log_sqlite_errors
        above: 0
    condition: []
    action:
      - service: notify.mobile_app_blokmeisterp9pro
        data:
          title: "⚠️ Plex Log Alert"
          message: >
            {% set err = states('sensor.plex_log_error_entries') | int(0) %}
            {% set sqlite = states('sensor.plex_log_sqlite_errors') | int(0) %}
            Detected issues in Plex logs:
            {% if err > 0 %}• {{ err }} error entry(ies){% endif %}
            {% if sqlite > 0 %}{{ '\n' if err > 0 }}• {{ sqlite }} SQLITE mention(s) with text {{ state_attr('sensor.plex_log_overview', 'sqlite_error_text') }}{% endif %}
          data:
            ttl: 0
            priority: high
            clickAction: "/lovelace/4"
            sticky: "true"
            tag: "plex_log_alert"
            group: "plex_log_alert"
            notification_icon: "mdi:database-alert"

  - alias: "[system|nas] Notify if any disk temperature is too high"
    id: yaml_automation_system_nas_notify_if_any_disk_temperature_is_too_high
    description: >
      Notifies mobile if any Unraid disk or parity gets over 45°C for 30+ minutes,
      or instantly if over 50°C. Repeats every 5 minutes while any disk remains
      above 45°C.
    mode: restart
    trigger:
      - platform: numeric_state
        entity_id:
          - sensor.tower_disk_parity_temperature
          - sensor.tower_disk_disk1_temperature
          - sensor.tower_disk_disk2_temperature
          - sensor.tower_disk_disk3_temperature
          - sensor.tower_disk_disk4_temperature
          - sensor.tower_disk_disk5_temperature
        above: 50
        id: critical
      - platform: numeric_state
        entity_id:
          - sensor.tower_disk_parity_temperature
          - sensor.tower_disk_disk1_temperature
          - sensor.tower_disk_disk2_temperature
          - sensor.tower_disk_disk3_temperature
          - sensor.tower_disk_disk4_temperature
          - sensor.tower_disk_disk5_temperature
        above: 45
        for:
          minutes: 30
        id: warning
    condition: []
    action:
      - variables:
          disks:
            - entity_id: sensor.tower_disk_parity_temperature
              name: Parity Disk
            - entity_id: sensor.tower_disk_disk1_temperature
              name: Disk 1
            - entity_id: sensor.tower_disk_disk2_temperature
              name: Disk 2
            - entity_id: sensor.tower_disk_disk3_temperature
              name: Disk 3
            - entity_id: sensor.tower_disk_disk4_temperature
              name: Disk 4
            - entity_id: sensor.tower_disk_disk5_temperature
              name: Disk 5
      - repeat:
          sequence:
            - variables:
                overheating_disks: >-
                  {%- set ns = namespace(items=[]) -%}
                  {%- for disk in disks -%}
                    {%- set temp = states(disk.entity_id) | float(none) -%}
                    {%- if temp is not none and temp > 45 -%}
                      {%- set ns.items = ns.items + [disk.name ~ ' (' ~ ('%.1f' | format(temp)) ~ '°C)'] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.items | join(', ') }}
                max_temp: >-
                  {%- set ns = namespace(values=[]) -%}
                  {%- for disk in disks -%}
                    {%- set temp = states(disk.entity_id) | float(none) -%}
                    {%- if temp is not none -%}
                      {%- set ns.values = ns.values + [temp] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ (ns.values | max) if ns.values | count > 0 else none }}
                any_disk_above_45: >-
                  {%- set ns = namespace(found=false) -%}
                  {%- for disk in disks -%}
                    {%- set temp = states(disk.entity_id) | float(none) -%}
                    {%- if temp is not none and temp > 45 -%}
                      {%- set ns.found = true -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.found }}
            - condition: template
              value_template: "{{ any_disk_above_45 }}"
            - service: notify.mobile_app_blokmeisterp9pro
              data:
                title: >-
                  {% if max_temp is not none and max_temp >= 50 %}
                    🚨 HDD Temperature Critical!
                  {% else %}
                    ⚠️ HDD Temperature Alert!
                  {% endif %}
                message: >-
                  The following disk(s) are overheating: {{ overheating_disks }}.
                data:
                  ttl: 0
                  priority: high
                  clickAction: /lovelace-default/6
                  group: hdd_overheat
                  tag: hdd_overheat
                  notification_icon: mdi:harddisk
            - wait_for_trigger:
                - platform: template
                  value_template: >-
                    {%- set ns = namespace(found=false) -%}
                    {%- for disk in disks -%}
                      {%- set temp = states(disk.entity_id) | float(none) -%}
                      {%- if temp is not none and temp > 45 -%}
                        {%- set ns.found = true -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ not ns.found }}
              timeout: "00:05:00"
              continue_on_timeout: true
          while:
            - condition: template
              value_template: >-
                {%- set ns = namespace(found=false) -%}
                {%- for disk in disks -%}
                  {%- set temp = states(disk.entity_id) | float(none) -%}
                  {%- if temp is not none and temp > 45 -%}
                    {%- set ns.found = true -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.found }}

  - alias: "[system|nas] Notify if Unraid cache usage is high"
    id: yaml_automation_system_nas_notify_if_unraid_cache_usage_is_high
    description: >
      Sends a high-priority mobile notification when the Unraid cache disk usage
      reaches 90% or higher. Updates the notification every 5 minutes while the
      cache remains above the threshold, then replaces it with a resolved message.
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.tower_disk_cache_usage
        above: 90
    condition: []
    action:
      - repeat:
          sequence:
            - variables:
                cache_usage: "{{ states('sensor.tower_disk_cache_usage') | float(none) }}"
            - service: notify.mobile_app_blokmeisterp9pro
              data:
                title: "⚠️ Unraid Cache High"
                message: >-
                  Cache usage: {{ cache_usage | round(1) }}%.
                data:
                  ttl: 0
                  priority: high
                  clickAction: "/config/devices/device/db9950b8bef71e0918844cce1953eeb5"
                  sticky: "true"
                  tag: "unraid_cache_usage_high"
                  group: "unraid_cache_usage_high"
                  notification_icon: "mdi:harddisk-alert"
            - wait_for_trigger:
                - platform: numeric_state
                  entity_id: sensor.tower_disk_cache_usage
                  below: 90
              timeout: "00:05:00"
              continue_on_timeout: true
          while:
            - condition: numeric_state
              entity_id: sensor.tower_disk_cache_usage
              above: 90
      - variables:
          cache_usage: "{{ states('sensor.tower_disk_cache_usage') | float(none) }}"
      - service: notify.mobile_app_blokmeisterp9pro
        data:
          title: "✅ Unraid Cache Resolved"
          message: >-
            Cache usage is back to {{ cache_usage | round(1) }}%.
          data:
            ttl: 0
            priority: high
            clickAction: "/config/devices/device/db9950b8bef71e0918844cce1953eeb5"
            sticky: "false"
            tag: "unraid_cache_usage_high"
            group: "unraid_cache_usage_high"
            notification_icon: "mdi:harddisk-check"

  - alias: "[system|nas] Notify phone on Unraid warning notification"
    id: yaml_automation_system_nas_notify_phone_on_unraid_warning_notification
    description: >
      Sends a high-priority mobile notification when the Unraid integration emits
      a warning-or-higher notification event.
    mode: queued
    trigger:
      - platform: state
        entity_id: event.tower_notifications
        not_from:
          - unavailable
          - unknown
        not_to:
          - unavailable
          - unknown
    condition:
      - condition: template
        value_template: >
          {{ trigger.to_state.attributes.event_type == 'notification_created' }}
      # - condition: template
      #   value_template: >
      #     {% set importance = trigger.to_state.attributes.importance | default('', true) | upper %}
      #     {{ importance in ['WARNING', 'WARN', 'ALERT', 'CRITICAL', 'ERROR'] }}
    action:
      - variables:
          event_attributes: "{{ trigger.to_state.attributes }}"
          event_json: >-
            {{
              {
                "entity_id": trigger.entity_id,
                "from_state": trigger.from_state.state if trigger.from_state else none,
                "to_state": trigger.to_state.state,
                "last_changed": trigger.to_state.last_changed.isoformat(),
                "last_updated": trigger.to_state.last_updated.isoformat(),
                "context": {
                  "id": trigger.to_state.context.id,
                  "parent_id": trigger.to_state.context.parent_id,
                  "user_id": trigger.to_state.context.user_id
                },
                "attributes": trigger.to_state.attributes
              } | to_json
            }}
          importance: >
            {{ trigger.to_state.attributes.importance | default('', true) | upper }}
          title: >
            {{ trigger.to_state.attributes.title | default('Unraid notification', true) }}
          subject: >
            {{ trigger.to_state.attributes.subject | default('', true) }}
          description: >
            {{ trigger.to_state.attributes.description | default('', true) }}
          notification_id: >
            {{ trigger.to_state.attributes.notification_id | default('unknown', true) }}
          formatted_timestamp: >
            {{ trigger.to_state.attributes.formatted_timestamp | default('', true) }}
          notification_title: >-
            {%- if importance in ['CRITICAL', 'ERROR'] -%}
              🚨 Unraid {{ importance }}: {{ title }}
            {%- elif importance == 'ALERT' -%}
              🚨 Unraid Alert: {{ title }}
            {%- else -%}
              ⚠️ Unraid Warning: {{ title }}
            {%- endif -%}
          notification_message: >-
            {%- if subject -%}
              Subject: {{ subject }}
            {%- else -%}
              Subject: -
            {%- endif -%}
            {%- if description %}
            Description: {{ description }}
            {%- else %}
            Description: -
            {%- endif -%}
            {%- if formatted_timestamp %}
            Time: {{ formatted_timestamp }}
            {%- endif %}
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ importance in ['WARNING', 'WARN', 'ALERT', 'CRITICAL', 'ERROR'] }}
            sequence:
              - service: notify.mobile_app_blokmeisterp9pro
                data:
                  title: "{{ notification_title }}"
                  message: "{{ notification_message }}"
                  data:
                    ttl: 0
                    priority: high
                    clickAction: /lovelace-default/server-monitor
                    group: unraid_notifications
                    tag: >-
                      unraid_notification_{{ notification_id | regex_replace('[^a-zA-Z0-9_-]', '_') }}
                    notification_icon: mdi:server-network

