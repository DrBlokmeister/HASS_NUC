##############
#    REST    #
##############
rest:
  - resource: !secret airvpn_API_resource
    headers:
      API-KEY: !secret airvpn_API_key
    scan_interval: 60  # Set the desired update interval in seconds
    sensor:
      - name: "AirVPN exit IP"
        unique_id: "yaml_restful_airvpn_exit_ip_new"
        value_template: >-
          {% if value_json is defined and value_json.sessions is defined and value_json.sessions | length > 0 %}
            {{ value_json.sessions[0].exit_ip }}
          {% else %}
            'unavailable'
          {% endif %}
        icon: "mdi:ip-network-outline"
      - name: "AirVPN Username"
        unique_id: "yaml_restful_airvpn_username"
        value_template: >-
          {% if value_json is defined and value_json.user and value_json.user.login is defined %}
            {{ value_json.user.login }}
          {% else %}
            'unavailable'
          {% endif %}
        icon: "mdi:account"
      - name: "AirVPN VPN IP"
        unique_id: "yaml_restful_airvpn_vpn_ip"
        value_template: >-
          {% if value_json is defined and value_json.connection and value_json.connection.vpn_ip is defined %}
            {{ value_json.connection.vpn_ip }}
          {% else %}
            'unavailable'
          {% endif %}
        icon: "mdi:ip-network-outline"
      - name: "AirVPN Exit IP"
        unique_id: "yaml_restful_airvpn_exit_ip"
        value_template: >-
          {% if value_json is defined and value_json.connection and value_json.connection.exit_ip is defined %}
            {{ value_json.connection.exit_ip }}
          {% else %}
            'unavailable'
          {% endif %}
        icon: "mdi:ip-network-outline"
      - name: "AirVPN Entry IP"
        unique_id: "yaml_restful_airvpn_entry_ip"
        value_template: >-
          {% if value_json is defined and value_json.connection and value_json.connection.entry_ip is defined %}
            {{ value_json.connection.entry_ip }}
          {% else %}
            'unavailable'
          {% endif %}
        icon: "mdi:ip-network-outline"
      - name: "AirVPN Server Name"
        unique_id: "yaml_restful_airvpn_server_name"
        value_template: >-
          {% if value_json is defined and value_json.connection and value_json.connection.server_name is defined %}
            {{ value_json.connection.server_name }}
          {% else %}
            'unavailable'
          {% endif %}
        icon: "mdi:server"
      - name: "AirVPN Server Country"
        unique_id: "yaml_restful_airvpn_server_country"
        value_template: >-
          {% if value_json is defined and value_json.connection and value_json.connection.server_country is defined %}
            {{ value_json.connection.server_country }}
          {% else %}
            'unavailable'
          {% endif %}
        icon: "mdi:earth"
      - name: "AirVPN Data Uploaded"
        unique_id: "yaml_restful_airvpn_data_uploaded"
        value_template: >-
          {% if value_json is defined and value_json.connection and value_json.connection.bytes_read is defined %}
            {{ (value_json.connection.bytes_read/(1024*1024*1024))|round(2) }}
          {% else %}
            'unavailable'
          {% endif %}
        device_class: data_size
        unit_of_measurement: GB
        icon: "mdi:upload-network-outline"
      - name: "AirVPN Data Downloaded"
        unique_id: "yaml_restful_airvpn_data_downloaded"
        value_template: >-
          {% if value_json is defined and value_json.connection and value_json.connection.bytes_write is defined %}
            {{ (value_json.connection.bytes_write/(1024*1024*1024))|round(2) }}
          {% else %}
            'unavailable'
          {% endif %}
        device_class: data_size
        unit_of_measurement: GB
        icon: "mdi:download-network-outline"
      - name: "AirVPN Connected Since"
        unique_id: "yaml_restful_airvpn_connected_since"
        value_template: >-
          {% if value_json is defined and value_json.connection and value_json.connection.connected_since_unix is defined %}
            {{ as_datetime(value_json.connection.connected_since_unix) }}
          {% else %}
            'unavailable'
          {% endif %}
        device_class: timestamp
        icon: "mdi:timer-sand"
      - name: "AirVPN Upload Speed"
        unique_id: "yaml_restful_airvpn_upload_speed"
        value_template: >-
          {% if value_json is defined and value_json.connection and value_json.connection.speed_read is defined %}
            {{ (value_json.connection.speed_read/(1024*1024))|round(2) }}
          {% else %}
            'unavailable'
          {% endif %}
        device_class: data_rate
        unit_of_measurement: MB/s
        icon: "mdi:upload-network"
      - name: "AirVPN Download Speed"
        unique_id: "yaml_restful_airvpn_download_speed"
        value_template: >-
          {% if value_json is defined and value_json.connection and value_json.connection.speed_write is defined %}
            {{ (value_json.connection.speed_write/(1024*1024))|round(2) }}
          {% else %}
            'unavailable'
          {% endif %}
        device_class: data_rate
        unit_of_measurement: MB/s
        icon: "mdi:download-network"

######################
#    COMMAND LINE    #
######################
command_line:
  - switch:
      unique_id: "unraid_array_control"
      name: "NAS Unraid Array"
      icon: "mdi:harddisk"
      command_on: >-
        ssh -i /config/.ssh/NUC_id_rsa -o StrictHostKeyChecking=no
        -q root@10.0.0.250
        '/usr/local/sbin/emcmd startarray'
      command_off: >-
        ssh -i /config/.ssh/NUC_id_rsa -o StrictHostKeyChecking=no
        -q root@10.0.0.250
        '/usr/local/sbin/emcmd stoparray'
      command_state: >-
        cat /config/www/nas_status.json | jq -r '.unraid_array_status'
      value_template: "{{ value == 'true' or value == true }}"
      availability: >-
        {{ states('binary_sensor.nas_ssh_reachability') }}
  - switch:
      unique_id: "wireguard_service_control"
      name: "NAS Wireguard Service"
      icon: "mdi:vpn"
      command_on: >-
        ssh -i /config/.ssh/NUC_id_rsa -o StrictHostKeyChecking=no -q
        root@10.0.0.250
        '/etc/rc.d/rc.wireguard start'
      command_off: >-
        ssh -i /config/.ssh/NUC_id_rsa -o StrictHostKeyChecking=no
        -q root@10.0.0.250
        '/etc/rc.d/rc.wireguard stop'
      command_state: >-
        cat /config/www/nas_status.json | jq -r '.wireguard_service_status'
      value_template: "{{ value == 'true' or value == true }}"
      availability: >-
        {{ states('binary_sensor.nas_ssh_reachability') }}

  # Plex Log: Count of SQLITE mentions
  - sensor:
      name: "Plex Log Overview"
      unique_id: yaml_command_line_sensor_plex_log_overview
      icon: mdi:database-search
      scan_interval: 900
      unit_of_measurement: errors
      command: >-
        ssh -i /config/.ssh/NUC_id_rsa -o StrictHostKeyChecking=no -q root@10.0.0.250 '
          LOG="/mnt/user/appdata/plex/Library/Application Support/Plex Media Server/Logs/Plex Media Server.log";
          SQLITE_DEBUG=$(grep "DEBUG" "$LOG" | grep -c "SQLITE" 2>/dev/null); SQLITE_DEBUG=${SQLITE_DEBUG:-0}
          SQLITE_INFO=$(grep "INFO" "$LOG" | grep -c "SQLITE" 2>/dev/null); SQLITE_INFO=${SQLITE_INFO:-0}
          SQLITE_WARN=$(grep "WARN" "$LOG" | grep -c "SQLITE" 2>/dev/null); SQLITE_WARN=${SQLITE_WARN:-0}
          SQLITE_ERROR=$(grep "ERROR" "$LOG" | grep -c "SQLITE" 2>/dev/null); SQLITE_ERROR=${SQLITE_ERROR:-0}
          WARN=$(grep -c "WARN" "$LOG" 2>/dev/null); WARN=${WARN:-0}
          ERROR=$(grep -c "ERROR" "$LOG" 2>/dev/null); ERROR=${ERROR:-0}
          LAST_SCAN=$(grep -F "Activity: Ended activity" "$LOG" | tail -1 | awk "{print \$1, \$2, \$3}");
          [ -z "$LAST_SCAN" ] && LAST_SCAN="";
          LAST_SCAN=${LAST_SCAN//\"/\\\"}
          # Get last SQLITE error line, if any
          SQLITE_ERROR_TEXT=$(grep "ERROR" "$LOG" | grep "SQLITE" | tail -1 | head -c 255)
          SQLITE_ERROR_TEXT=${SQLITE_ERROR_TEXT//\"/\\\"}
          echo "{\"sqlite_debug\": $SQLITE_DEBUG, \"sqlite_info\": $SQLITE_INFO, \"sqlite_warn\": $SQLITE_WARN, \"sqlite_error\": $SQLITE_ERROR, \"warn\": $WARN, \"error\": $ERROR, \"last_scan\": \"$LAST_SCAN\", \"sqlite_error_text\": \"$SQLITE_ERROR_TEXT\"}"
        ' || echo '{}'
      value_template: >
        {% if value_json is defined and value_json.error is defined %}
          {{ value_json.error | int(0) }}
        {% else %}
          0
        {% endif %}
      json_attributes:
        - sqlite_debug
        - sqlite_info
        - sqlite_warn
        - sqlite_error
        - warn
        - error
        - last_scan
        - sqlite_error_text
      availability: "{{ is_state('binary_sensor.nas_ssh_reachability', 'on') }}"

  - binary_sensor:
      name: "NAS SSH Reachability"
      command: "cat /config/www/nas_status.json | jq -r '.nas_available'"
      payload_on: "true"
      payload_off: "false"
      device_class: connectivity

  - sensor:
      name: piKVM NAS System Details
      unique_id: yaml_command_line_sensor_pikvm_nas_system_details
      icon: mdi:database-search
      scan_interval: 300
      command_timeout: 20
      state_class: measurement
      command: >-
        ssh -i /config/.ssh/NUC_id_rsa -o StrictHostKeyChecking=no -q root@10.0.30.20 '
          PATH=$PATH:/usr/sbin:/sbin;
          iface=wlan0;
          iw=$(iwconfig "$iface");
          sig=$(echo "$iw" | grep -oP "Signal level=-?\K\d+");
          lq_pair=$(echo "$iw" | grep -oP "Link Quality=\K\d+/\d+");
          IFS=/ read lq_cur lq_max <<<"$lq_pair";
          lq_pct=$(( lq_max>0 ? lq_cur*100/lq_max : 0 ));
          bit=$(echo "$iw" | grep -oP "Bit Rate=\K[0-9.]+");
          txp=$(echo "$iw" | grep -oP "Tx-Power=\K\d+");
          apm=$(echo "$iw" | grep -oP "Access Point: \K([0-9A-F]{2}:){5}[0-9A-F]{2}");
          missed=$(echo "$iw" | grep -oP "Missed beacon:\K\d+");
          retry=$(echo "$iw" | grep -oP "Tx excessive retries:\K\d+");
          ssid=$(iwgetid -r);
          load=$(cut -d" " -f1 /proc/loadavg);
          temp=$(awk "{printf \"%.1f\", \$1/1000}" /sys/class/thermal/thermal_zone0/temp);
          printf "{\"signal_level\":%s,\"link_quality\":%s,\"bit_rate\":%s,\"tx_power\":%s,\"ap_mac\":\"%s\",\"ssid\":\"%s\",\"missed_beacon\":%s,\"tx_retries\":%s,\"load_avg\":%s,\"cpu_temp\":%s}\n" \
                "${sig:-0}" "${lq_pct:-0}" "${bit:-0}" "${txp:-0}" \
                "${apm:-\"\"}" "${ssid:-\"\"}" "${missed:-0}" "${retry:-0}" \
                "${load:-0}" "${temp:-0}"
        ' || echo '{}'
      value_template: "{{ value_json.load_avg | default(0) }}"
      json_attributes:
        - signal_level
        - link_quality
        - bit_rate
        - tx_power
        - ap_mac
        - ssid
        - missed_beacon
        - tx_retries
        - cpu_temp

  - sensor:
      name: RPI4 OMV System Details
      unique_id: yaml_command_line_sensor_rpi4_omv_system_details
      icon: mdi:nas
      scan_interval: 300
      command_timeout: 30
      state_class: measurement
      unit_of_measurement: "%"
      command: >-
        ssh
        -i /config/.ssh/NUC_id_rsa
        -o BatchMode=yes
        -o StrictHostKeyChecking=accept-new
        -o ConnectTimeout=8
        -o ConnectionAttempts=1
        -q
        homeassistant@10.0.70.2 '
          PATH=$PATH:/usr/sbin:/sbin;

          u1=06ea6125-0061-44c4-9139-d06e8cfe9f8c;
          u2=e6ca1630-5eae-4019-aa30-d9ee3beb08a1;
          p1=/srv/dev-disk-by-uuid-06ea6125-0061-44c4-9139-d06e8cfe9f8c;
          p2=/srv/dev-disk-by-uuid-e6ca1630-5eae-4019-aa30-d9ee3beb08a1;

          set -- $(head -n 1 /proc/stat);
          u_1=$2;
          n_1=$3;
          s_1=$4;
          i_1=$5;
          w_1=$6;
          q_1=$7;
          sq_1=$8;
          st_1=$9;
          total_1=$((u_1+n_1+s_1+i_1+w_1+q_1+sq_1+st_1));
          idle_1=$((i_1+w_1));

          sleep 1;

          set -- $(head -n 1 /proc/stat);
          u_2=$2;
          n_2=$3;
          s_2=$4;
          i_2=$5;
          w_2=$6;
          q_2=$7;
          sq_2=$8;
          st_2=$9;
          total_2=$((u_2+n_2+s_2+i_2+w_2+q_2+sq_2+st_2));
          idle_2=$((i_2+w_2));

          dt=$((total_2-total_1));
          di=$((idle_2-idle_1));
          cpu_usage=0;

          if [ "$dt" -gt 0 ]; then
            cpu_usage=$(((100*(dt-di)+dt/2)/dt));
          fi;

          set -- $(grep "^MemTotal:" /proc/meminfo);
          mem_total_kb=$2;
          set -- $(grep "^MemAvailable:" /proc/meminfo);
          mem_available_kb=$2;

          memory_usage=0;

          if [ "$mem_total_kb" -gt 0 ]; then
            memory_usage=$(((mem_total_kb-mem_available_kb)*100/mem_total_kb));
          fi;

          memory_available_mb=$((mem_available_kb/1024));

          set -- $(cat /proc/loadavg);
          load_1m=$1;

          set -- $(cat /proc/uptime);
          uptime_seconds=${1%.*};

          temp_milli=$(cat /sys/class/thermal/thermal_zone0/temp 2>/dev/null || echo 0);
          temp_tenths=$(((temp_milli+50)/100));
          cpu_temp=$((temp_tenths/10)).$((temp_tenths%10));

          disk1_available=false;
          disk1_rw=false;
          disk1_usage=null;
          disk1_free_gb=null;

          if
            test -b "/dev/disk/by-uuid/$u1" &&
            findmnt -rn -S "UUID=$u1" -M "$p1" >/dev/null &&
            timeout 3 stat -f "$p1" >/dev/null;
          then
            disk1_available=true;

            if findmnt -rn -M "$p1" -o OPTIONS | grep -qw rw; then
              disk1_rw=true;
            fi;

            disk1_usage=$(df --output=pcent "$p1" | tail -n 1 | tr -dc "0-9");
            set -- $(df -Pk "$p1" | tail -n 1);
            disk1_free_gb=$(($4/1048576));
          fi;

          disk2_available=false;
          disk2_rw=false;
          disk2_usage=null;
          disk2_free_gb=null;

          if
            test -b "/dev/disk/by-uuid/$u2" &&
            findmnt -rn -S "UUID=$u2" -M "$p2" >/dev/null &&
            timeout 3 stat -f "$p2" >/dev/null;
          then
            disk2_available=true;

            if findmnt -rn -M "$p2" -o OPTIONS | grep -qw rw; then
              disk2_rw=true;
            fi;

            disk2_usage=$(df --output=pcent "$p2" | tail -n 1 | tr -dc "0-9");
            set -- $(df -Pk "$p2" | tail -n 1);
            disk2_free_gb=$(($4/1048576));
          fi;

          smb_active=false;
          smb_port_445=false;
          omv_active=false;

          systemctl is-active --quiet smbd && smb_active=true;
          ss -ltn | grep -q ":445 " && smb_port_445=true;
          systemctl is-active --quiet openmediavault-engined && omv_active=true;

          share_external_backups=false;
          share_photos=false;
          share_backups=false;

          if
            [ "$disk1_available" = true ] &&
            [ "$smb_active" = true ] &&
            test -n "$(testparm -s --parameter-name=path --section-name=External_Backups 2>/dev/null)" &&
            timeout 3 stat -f "$p1/External_Backups" >/dev/null;
          then
            share_external_backups=true;
          fi;

          if
            [ "$disk1_available" = true ] &&
            [ "$smb_active" = true ] &&
            test -n "$(testparm -s --parameter-name=path --section-name=Photos 2>/dev/null)" &&
            timeout 3 stat -f "$p1/Photos" >/dev/null;
          then
            share_photos=true;
          fi;

          if
            [ "$disk2_available" = true ] &&
            [ "$smb_active" = true ] &&
            test -n "$(testparm -s --parameter-name=path --section-name=Backups 2>/dev/null)" &&
            timeout 3 stat -f "$p2/Backups" >/dev/null;
          then
            share_backups=true;
          fi;

          root_rw=false;
          findmnt -rn -M / -o OPTIONS | grep -qw rw && root_rw=true;
          root_usage=$(df --output=pcent / | tail -n 1 | tr -dc "0-9");

          failed_units=$(systemctl --failed --no-legend --plain | wc -l | tr -d " ");

          recent_storage_errors=$(journalctl -k --since "-10 minutes" --no-pager -q 2>/dev/null | grep -Eic "USB disconnect|reset (high-speed|SuperSpeed) USB device|I/O error|Buffer I/O error|blk_update_request|EXT4-fs error|uas_eh_abort_handler|device offline" || true);

          overall_health=0;

          if
            [ "$disk1_available" = true ] &&
            [ "$disk1_rw" = true ] &&
            [ "$disk2_available" = true ] &&
            [ "$disk2_rw" = true ] &&
            [ "$smb_active" = true ] &&
            [ "$smb_port_445" = true ] &&
            [ "$share_external_backups" = true ] &&
            [ "$share_photos" = true ] &&
            [ "$share_backups" = true ] &&
            [ "$omv_active" = true ] &&
            [ "$root_rw" = true ] &&
            [ "$recent_storage_errors" -eq 0 ];
          then
            overall_health=100;
          fi;

          printf "{\"overall_health\":%s,\"reachable\":true,\"cpu_usage_pct\":%s,\"cpu_temp_c\":%s,\"load_1m\":%s,\"memory_usage_pct\":%s,\"memory_available_mb\":%s,\"uptime_seconds\":%s,\"disk1_available\":%s,\"disk1_rw\":%s,\"disk1_usage_pct\":%s,\"disk1_free_gb\":%s,\"disk2_available\":%s,\"disk2_rw\":%s,\"disk2_usage_pct\":%s,\"disk2_free_gb\":%s,\"smb_active\":%s,\"smb_port_445\":%s,\"share_external_backups\":%s,\"share_photos\":%s,\"share_backups\":%s,\"omv_active\":%s,\"root_rw\":%s,\"root_usage_pct\":%s,\"failed_units\":%s,\"recent_storage_errors\":%s}\n" "$overall_health" "$cpu_usage" "$cpu_temp" "$load_1m" "$memory_usage" "$memory_available_mb" "$uptime_seconds" "$disk1_available" "$disk1_rw" "$disk1_usage" "$disk1_free_gb" "$disk2_available" "$disk2_rw" "$disk2_usage" "$disk2_free_gb" "$smb_active" "$smb_port_445" "$share_external_backups" "$share_photos" "$share_backups" "$omv_active" "$root_rw" "$root_usage" "$failed_units" "$recent_storage_errors";
        ' 2>/dev/null || printf '{"overall_health":0,"reachable":false}\n'
      value_template: >-
        {{ value_json.overall_health | default(0) | int }}
      json_attributes:
        - reachable
        - cpu_usage_pct
        - cpu_temp_c
        - load_1m
        - memory_usage_pct
        - memory_available_mb
        - uptime_seconds
        - disk1_available
        - disk1_rw
        - disk1_usage_pct
        - disk1_free_gb
        - disk2_available
        - disk2_rw
        - disk2_usage_pct
        - disk2_free_gb
        - smb_active
        - smb_port_445
        - share_external_backups
        - share_photos
        - share_backups
        - omv_active
        - root_rw
        - root_usage_pct
        - failed_units
        - recent_storage_errors

