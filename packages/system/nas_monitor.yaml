homeassistant:
  customize: {}


monitor_docker:
  - name: Docker Tower
    url: http://10.0.0.250:2375
    monitored_conditions:
      - containers_1cpu_percentage
      - uptime
      - version
      - containers_running
      - containers_total
      - state
      - status
      - memory
      - cpu_percentage

