title: Main Power
icon: mdi:lightning-bolt
cards:
  - type: horizontal-stack
    cards:
      - type: gauge
        entity: sensor.total_power_consumption_watt
        name: Total Power Usage
        min: 0
        max: 5000
        severity:
          green: 0
          yellow: 2500
          red: 3500
      - type: gauge
        entity: sensor.solar_panel_power_production_available
        name: Solar Production
        min: 0
        max: 5000
        severity:
          green: 0
          yellow: 2500
          red: 3500

  - type: custom:apexcharts-card
    header:
      show: true
      title: Energy Distribution Today
    update_interval: 15min
    graph_span: 24h
    chart_type: donut
    series:
      - entity: sensor.plug_study_desk_energy_today
        name: Computer
        color: '#DC143C' # Crimson
      - entity: sensor.plug_nas_energy_today
        name: NAS
        color: '#4682B4'
      - entity: sensor.plug_poe_switch_energy_today
        name: PoE Switch
        color: '#FF8C00'
      - entity: sensor.plug_nuc_energy_today
        name: NUC
        color: '#6B8E23'
      - entity: sensor.plug_washing_machine_energy_today
        name: Washing Machine
        color: '#00CED1'
      - entity: sensor.plug_dishwasher_energy_today
        name: Dishwasher
        color: '#DB7093'
      - entity: sensor.plug_10gb_switch_energy_today
        name: 10Gb Switch
        color: '#1976D2'
      - entity: sensor.plug_3d_printer_energy_today
        name: 3D Printer
        color: '#FFA726'
      - entity: sensor.plug_air_conditioner_energy_today
        name: Air Conditioner
        color: '#00ACC1'
      - entity: sensor.blitzwolf_ambilight_amplifier_daily_energy
        name: Ambilight Amplifier
        color: '#FFB300'
      - entity: sensor.plug_electric_bike_energy_today
        name: Electric Bike
        color: '#9CCC65'
      - entity: sensor.plug_electric_car_energy_today
        name: Electric Car
        color: '#FFC107'
      - entity: sensor.plug_oven_energy_today
        name: Oven
        color: '#E64A19'
      - entity: sensor.plug_router_energy_today
        name: Router
        color: '#03A9F4'
      - entity: sensor.plug_study_workbench_energy_today
        name: Study Workbench
        color: '#66BB6A'
      - entity: sensor.plug_tv_energy_today
        name: TV
        color: '#FFCA28'
      - entity: sensor.plug_watercooker_energy_today
        name: Watercooker
        color: '#1E90FF'
      - entity: sensor.heatpump_verwarming_daily_energy_use
        name: Heating
        color: '#FF4500'
      - entity: sensor.heatpump_circulation_daily_energy_use
        name: Circulation
        color: '#32CD32'
      - entity: sensor.heatpump_tapwater_daily_energy_use
        name: Tapwater
        color: '#2E8B57'
      - entity: sensor.ventilation_daily_energy_use
        name: Ventilation
        color: '#A0522D'
      - entity: sensor.all_lights_power_estimate_energy_daily
        name: Lights
        color: '#FFA07A'
      - entity: sensor.daily_unknown_energy
        name: Unknown
        color: '#6A5ACD'

  - type: custom:apexcharts-card
    header:
      show: true
      title: Power Usage per Device
    graph_span: 12h
    update_interval: 15min
    apex_config:
      chart:
        height: 400px
    yaxis:
      - min: 0
        max: ~4000
        decimals: 0
        apex_config:
          tickAmount: 6
          forceNiceScale: true
    all_series_config:
      group_by:
        func: avg
        duration: 10min
    series:
      - entity: sensor.plug_study_desk_power
        name: Computer
        color: '#DC143C' # Crimson
      - entity: sensor.plug_nas_power
        name: NAS
        color: '#4682B4' # Steel Blue
      - entity: sensor.plug_poe_switch_power
        name: PoE Switch
        color: '#FF8C00'
      - entity: sensor.plug_nuc_power
        name: NUC
        color: '#6B8E23'
      - entity: sensor.plug_heat_pump_power
        name: Circulation
        color: '#32CD32' # Lime Green
      - entity: sensor.plug_washing_machine_power
        name: Washing Machine
        color: '#00CED1'
      - entity: sensor.plug_dishwasher_power
        name: Dishwasher
        color: '#DB7093'
      - entity: sensor.plug_10gb_switch_power
        name: 10Gb Switch
        color: '#1976D2'
      - entity: sensor.plug_3d_printer_power
        name: 3D Printer
        color: '#FFA726'
      - entity: sensor.plug_air_conditioner_power
        name: Air Conditioner
        color: '#00ACC1'
      - entity: sensor.blitzwolf_ambilight_amplifier_power
        name: Ambilight Amplifier
        color: '#FFB300'
      - entity: sensor.plug_computer_power
        name: Bare Computer
        color: '#DC143C'
      - entity: sensor.plug_electric_bike_power
        name: Electric Bike
        color: '#9CCC65'
      - entity: sensor.plug_electric_car_power
        name: Electric Car
        color: '#FFC107'
      - entity: sensor.plug_epaper_ap_power
        name: Epaper AP
        color: '#8D6E63'
      - entity: sensor.plug_oven_power
        name: Oven
        color: '#E64A19'
      - entity: sensor.plug_router_power
        name: Router
        color: '#03A9F4'
      - entity: sensor.plug_study_workbench_power
        name: Study Workbench
        color: '#66BB6A'
      - entity: sensor.plug_tv_power
        name: TV
        color: '#FFCA28'
      - entity: sensor.plug_watercooker_power
        name: Watercooker
        color: '#1E90FF'
      - entity: sensor.heatpump_heating_power
        name: Heating
        color: '#FF4500'
      - entity: sensor.heatpump_tapwater_power
        name: Tapwater
        color: '#2E8B57'
      - entity: sensor.ventilation_power_estimate
        name: Ventilation
        color: '#A0522D'
      - entity: sensor.all_lights_power_estimate_power
        name: Lights
        color: '#FFA07A'
      - entity: sensor.vacuums_power_estimate
        name: Vacuums
        color: '#6A5ACD'
      - entity: sensor.averaged_unknown_power
        name: Unknown
        color: '#778899'

  - type: custom:apexcharts-card
    header:
      show: true
      title: Power Production
    update_interval: 1min
    yaxis:
      - min: 0
        max: ~1000
        decimals: 0
        apex_config:
          tickAmount: 4
          forceNiceScale: True
    apex_config:
      chart:
        height: 200px
    graph_span: 24h
    chart_type: line
    series:
      - entity: sensor.solar_panel_power_production_available
        name: Solar Production

  - type: 'custom:apexcharts-card'
    graph_span: 24h
    yaxis:
      - min: ~0
        max: ~0.5
        decimals: 3
        apex_config:
          tickAmount: 8
          forceNiceScale: True
    header:
      title: Energy price today (€/kWh)
      show: true
    span:
      start: day
    now:
      show: true
      label: Now
    experimental:
      color_threshold: true
    series:
      - entity: sensor.nordpool_energy_price_hourly
        float_precision: 2
        color_threshold:
            # color can be a color name, rgb(r, g, b), '#0000ff' or var(--color-variable)
            # default is: the default color of the serie
            # Used this gradient generator: https://colordesigner.io/gradient-generator
          - value: -1
            color: '#5963c0'
          - value: -0.66
            color: '#2681cb'
          - value: -0.33
            color: '#2599c8'
          - value: 0.0
            color: '#59adc0'
          - value: 0.033
            color: '#39afb4'
          - value: 0.066
            color: '#2bb09e'
          - value: 0.1
            color: '#3faf81'
          - value: 0.133
            color: '#5eab5f'
          - value: 0.166
            color: '#7ea53b'
          - value: 0.2
            color: '#9f9b13'
          - value: 0.233
            color: '#c18c00'
          - value: 0.266
            color: '#e27609'
          - value: 0.3
            color: '#ff5833'
          - value: 0.333
            color: '#ed4323'
          - value: 0.366
            color: '#db2b12'
          - value: 0.4
            color: '#c90000'
        type: column
        data_generator: |
          return entity.attributes.raw_today.map((start, index) => {
            return [new Date(start["start"]).getTime(), entity.attributes.raw_today[index]["value"]];
          });

  - type: custom:mini-graph-card
    entities:
      - entity: sensor.daily_energy_use
    name: Daily Energy Use (Last Week)
    hours_to_show: 168
    lower_bound: 0
    min_bound_range: 15
    aggregate_func: max
    group_by: date
    show:
      graph: bar

  - type: custom:mini-graph-card
    entities:
      - entity: sensor.daily_water_use
    name: Daily Water Use (Last Week)
    hours_to_show: 168
    lower_bound: 0
    min_bound_range: 150
    aggregate_func: max
    group_by: date
    show:
      graph: bar
