##########################################  HERE BEGINS THE AIR QUALITY TAB  ##########################################
title: Air Quality
icon: "mdi:air-purifier"
badges: []
cards:
  - type: vertical-stack
    cards:
      - type: custom:mushroom-title-card
        title: CO₂ Concentrations
        subtitle: Tap a room for a 7-day overlay
        alignment: center
      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.bedroom_co2
            primary: Bedroom
            secondary: >-
              {%- set raw = states('sensor.bedroom_co2') -%}
              {%- set co2 = raw | float(0) -%}
              {%- if raw in ['unknown', 'unavailable', 'none', 'None', ''] -%}
                Unavailable
              {%- elif co2 < 800 -%}
                {{ co2 | round(0) }} ppm · good
              {%- elif co2 < 1000 -%}
                {{ co2 | round(0) }} ppm · okay
              {%- elif co2 < 1400 -%}
                {{ co2 | round(0) }} ppm · ventilate
              {%- else -%}
                {{ co2 | round(0) }} ppm · high
              {%- endif -%}
            icon: mdi:bed-king-outline
            icon_color: >-
              {%- set raw = states('sensor.bedroom_co2') -%}
              {%- set co2 = raw | float(0) -%}
              {%- if raw in ['unknown', 'unavailable', 'none', 'None', ''] -%}
                grey
              {%- elif co2 < 800 -%}
                green
              {%- elif co2 < 1000 -%}
                amber
              {%- elif co2 < 1400 -%}
                orange
              {%- else -%}
                red
              {%- endif -%}
            fill_container: true
            multiline_secondary: true
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: Bedroom CO₂
                  content:
                    type: custom:decluttering-card
                    template: last_7_days_apexcharts_card
                    variables:
                      - entity: sensor.bedroom_co2
                      - title: Bedroom CO₂ - past 7 days
                      - color_today: "#4682B4"
                      - color_1day_ago: "#5487B2"
                      - color_2days_ago: "#618CB0"
                      - color_3days_ago: "#6E91AF"
                      - color_4days_ago: "#7A96AD"
                      - color_5days_ago: "#879AAB"
                      - color_6days_ago: "#929FAA"
                      - unit: ppm
                      - float_precision: 0
                      - transform: "return Math.round(x);"
                      - group_by_func: avg
                      - group_by_duration: 15min
                      - yaxis:
                        - min: 400
                          max: ~1000
                          decimals: 0
                          align_to: 200
                          apex_config:
                            tickAmount: 4
                            forceNiceScale: true
            hold_action:
              action: more-info
            card_mod:
              style: |
                ha-card {
                  min-height: 82px;
                  border-radius: 18px;
                  border: 1px solid rgba(255, 255, 255, 0.08);
                  background: linear-gradient(135deg, rgba(var(--rgb-card-background-color), 0.94), rgba(var(--rgb-card-background-color), 0.68));
                }
                mushroom-shape-icon {
