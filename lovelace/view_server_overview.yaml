- type: vertical-stack
  cards:
  - type: custom:button-card
    template: server_status
    name: Running containers
    icon: mdi:docker
    entity: sensor.docker_tower_containers_running
    variables:
      c_health: |-
        [[[
        const h = variables.b_helpers;

        const list=Object.values(hass.states).filter(e=>/^switch\.(tower|study_tower)_container_/.test(e.entity_id));
        const running=list.filter(e=>e.state==='on').length;
        const unknown=list.filter(e=>!['on','off'].includes(e.state)).length;
        return h.health(list.length ? `${running} running · ${list.length} total${unknown ? ` · ${unknown} unavailable` : ''}` : 'Container inventory unavailable',unknown || !list.length?'amber':'blue');
        ]]]
    triggers_update:
    - sensor.time
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: All containers
          content:
            type: vertical-stack
            cards:
            - type: markdown
              text_only: true
              content: All containers · select a container for its resource history and confirmed start/stop control. Stopped
                containers are neutral; no expected-running policy is applied.
            - type: custom:auto-entities
              show_empty: true
              card:
                type: grid
                square: false
                columns: 2
              card_param: cards
              filter:
                template: |2

                  {% set ns = namespace(cards=[]) %}
                  {% for e in states.switch | sort(attribute='name') %}
                    {% if e.entity_id is match('^switch\.(tower|study_tower)_container_') %}
                      {% set key = e.entity_id.split('_container_',1)[1] %}
                      {% set name = e.name | replace('Tower Container ', '') %}
                      {% set ns.cards = ns.cards + [{'type':'custom:decluttering-card','template':'server_container','variables':[{'status_entity':e.entity_id},{'key':key},{'name':name}]}] %}
                    {% endif %}
                  {% endfor %}
                  {{ ns.cards | tojson }}
          size: wide
    hold_action:
      action: more-info
      entity: sensor.docker_tower_containers_running
  - type: grid
    square: false
    columns: 1
    cards:
    - type: custom:mushroom-template-card
      primary: Resource history
      secondary: 8 priority containers
      icon: mdi:chart-line
      tap_action:
        action: fire-dom-event
        browser_mod:
          service: browser_mod.popup
          data:
            title: Container resource history
            content:
              type: vertical-stack
              cards:
              - type: markdown
                text_only: true
                content: 'Resource source: **Docker Monitor**. The same eight workloads keep consistent ordering and colors
                  in both charts. CPU can exceed 100% across multiple cores; missing samples remain gaps.'
              - type: custom:apexcharts-card
                graph_span: 24h
                update_interval: 1min
                header:
                  show: true
                  title: CPU · eight priority containers
                  show_states: true
                  colorize_states: true
                apex_config:
                  chart:
                    height: 250
                    animations:
                      enabled: false
                  legend:
                    show: false
                  stroke:
                    curve: straight
                  grid:
                    borderColor: rgba(127,127,127,0.15)
                  tooltip:
                    shared: true
                    intersect: false
