  - type: markdown
    text_only: true
    content: 'CPU and memory: Docker Monitor · select a container for details.'
  - type: custom:auto-entities
    show_empty: true
    card:
      type: grid
      square: false
      columns: 2
    card_param: cards
    filter:
      template: |2

        {% set ns = namespace(cards=[]) %}
        {% for e in states.switch | sort(attribute='name') %}
          {% if e.entity_id is match('^switch\.(tower|study_tower)_container_') and e.state == 'on' %}
            {% set key = e.entity_id.split('_container_',1)[1] %}
            {% set name = e.name | replace('Tower Container ', '') %}
            {% set ns.cards = ns.cards + [{'type':'custom:decluttering-card','template':'server_container','variables':[{'status_entity':e.entity_id},{'key':key},{'name':name}]}] %}
          {% endif %}
        {% endfor %}
        {{ ns.cards | tojson }}
- type: vertical-stack
  cards:
  - type: markdown
    content: '## Server and power'
    text_only: true
  - type: conditional
    conditions:
    - entity: sensor.tower_ups_ut850eg_status
      state: ONLINE
    - entity: binary_sensor.tower_ups_connected
      state: 'on'
    - condition: numeric_state
      entity: sensor.tower_ups_battery
      above: 30
    - entity: sensor.tower_ups_ut850eg_battery_health
      state: Good
    card: *id004
  - type: custom:button-card
    template: server_status
    name: Server details
    icon: mdi:server
    entity: sensor.tower_unraid_version
    variables:
      c_health: |-
        [[[
        const h = variables.b_helpers;

        return h.health(h.known('sensor.tower_unraid_version') ? `Unraid ${h.s('sensor.tower_unraid_version')}` : 'Version unavailable','blue');
        ]]]
    triggers_update:
    - sensor.time
    - sensor.tower_unraid_version
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: Server diagnostics
          content: *id002
    hold_action:
      action: more-info
      entity: sensor.tower_unraid_version
- type: custom:collapsable-cards
  title: Desk powerstrip
  cards:
  - type: grid
    square: false
    columns: 3
    cards:
    - type: custom:mushroom-template-card
      entity: sensor.plug_study_desk_power
      primary: Power
      secondary: '{{ states(''sensor.plug_study_desk_power'') | float(0) | round(0) }} W'
      icon: mdi:flash
      icon_color: |-
        {% set p = states('sensor.plug_study_desk_power') | float(0) %} {% if p >= 1000 %}
          red
        {% elif p >= 600 %}
          amber
        {% else %}
          green
        {% endif %}
      fill_container: true
    - type: custom:mushroom-template-card
      entity: sensor.plug_study_desk_current
