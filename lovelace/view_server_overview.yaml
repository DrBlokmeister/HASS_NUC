# Redesigned server tab; the original view_server.yaml is unchanged.
title: Server overview
path: server-overview
icon: mdi:server-network
type: masonry
badges: []
cards:
- type: vertical-stack
  cards:
  - type: markdown
    content: '## Critical status'
    text_only: true
  - type: grid
    square: false
    columns: 2
    cards:
    - type: custom:button-card
      template: server_status
      name: Parity integrity
      icon: mdi:shield-check
      entity: binary_sensor.tower_parity_valid
      variables:
        c_health: |-
          [[[
          const h = variables.b_helpers;

          const validity = 'binary_sensor.tower_parity_valid';
          const running = 'binary_sensor.tower_parity_check_running';
          const paused = 'binary_sensor.tower_parity_check_paused';
          const errors = h.n('sensor.tower_last_parity_check_errors');
          if (h.s(validity) === 'on') return h.health('Parity integrity problem', 'red');
          if (errors != null && errors > 0) return h.health(`${errors} reported parity errors`, 'red');
          if (!h.binary(validity) || !h.binary(running) || !h.binary(paused)) return h.health('Parity status incomplete', 'disabled');
          if (h.s(paused) === 'on') return h.health(`Paused · ${h.fmt(h.n('sensor.tower_parity_check_progress'),1,'%')}`, 'amber');
          if (h.s(running) === 'on') return h.health(`Checking · ${h.fmt(h.n('sensor.tower_parity_check_speed'),1,' MB/s')}`, 'blue');
          return h.health(errors == null ? 'Valid · last result unavailable' : 'Valid · no errors reported', errors == null ? 'amber' : 'green');
          ]]]
      triggers_update:
      - binary_sensor.tower_parity_check_paused
      - binary_sensor.tower_parity_check_running
      - binary_sensor.tower_parity_valid
      - sensor.time
      - sensor.tower_last_parity_check_errors
      - sensor.tower_parity_check_progress
      - sensor.tower_parity_check_speed
      tap_action:
        action: fire-dom-event
        browser_mod:
          service: browser_mod.popup
          data:
            title: Parity and array
            content: &id001
              type: vertical-stack
              cards:
              - type: entities
                title: Current operation
                show_header_toggle: false
                entities:
                - entity: binary_sensor.tower_parity_check_running
                  name: Running
                - entity: binary_sensor.tower_parity_check_paused
                  name: Paused
                - entity: sensor.tower_parity_check_progress
                  name: Progress
                - entity: sensor.tower_parity_check_speed
                  name: Speed
                - entity: sensor.tower_parity_check_elapsed
                  name: Elapsed
                - entity: sensor.tower_parity_check_estimated
                  name: Estimated remaining
                - entity: binary_sensor.tower_parity_valid
                  name: Parity integrity problem
              - type: entities
                title: Last reported check
                show_header_toggle: false
                entities:
                - entity: sensor.tower_last_parity_check
                  name: Check timestamp
                - entity: sensor.tower_last_parity_check_errors
                  name: Reported errors
              - type: markdown
                text_only: true
                content: A previous check timestamp with zero reported errors is not proof of a completed successful check.
                  Estimated remaining time is supplied by Unraid and may be unavailable.
              - type: conditional
                conditions:
                - entity: binary_sensor.tower_parity_check_running
                  state: 'on'
                - entity: binary_sensor.tower_parity_check_paused
                  state: 'off'
                card:
                  type: custom:mushroom-template-card
                  primary: Pause parity
                  icon: mdi:pause
                  tap_action:
                    action: perform-action
                    perform_action: button.press
                    target:
                      entity_id: button.tower_pause_parity_check
                    confirmation:
                      text: Pause the parity check on Tower?
              - type: conditional
                conditions:
                - entity: binary_sensor.tower_parity_check_paused
                  state: 'on'
                card:
                  type: custom:mushroom-template-card
                  primary: Resume parity
                  icon: mdi:play
                  tap_action:
                    action: perform-action
                    perform_action: button.press
                    target:
                      entity_id: button.tower_resume_parity_check
                    confirmation:
                      text: Resume the parity check on Tower?
              - type: conditional
                conditions:
                - entity: binary_sensor.tower_parity_check_running
                  state: 'off'
                - entity: binary_sensor.tower_parity_check_paused
                  state: 'off'
                card:
                  type: grid
                  square: false
                  columns: 2
                  cards:
                  - type: custom:mushroom-template-card
                    primary: Check parity
                    icon: mdi:shield-search
                    tap_action:
                      action: perform-action
                      perform_action: switch.turn_on
                      target:
                        entity_id: switch.tower_parity_check
                      confirmation:
                        text: Start a non-correcting parity check on Tower?
                  - type: custom:mushroom-template-card
                    primary: Correct parity
                    icon: mdi:shield-sync
                    tap_action:
                      action: perform-action
                      perform_action: button.press
                      target:
                        entity_id: button.tower_parity_check_correcting
                      confirmation:
                        text: Start a CORRECTING parity check on Tower? This can write corrections to the parity disk.
              - type: conditional
                conditions:
                - condition: or
                  conditions:
                  - entity: binary_sensor.tower_parity_check_running
                    state: 'on'
                  - entity: binary_sensor.tower_parity_check_paused
                    state: 'on'
                card:
                  type: custom:mushroom-template-card
                  primary: Cancel check
                  icon: mdi:stop
                  tap_action:
                    action: perform-action
                    perform_action: switch.turn_off
                    target:
                      entity_id: switch.tower_parity_check
                    confirmation:
                      text: Cancel the parity check on Tower?
              - type: conditional
                conditions:
                - entity: switch.tower_array
                  state: 'on'
                card:
                  type: custom:mushroom-template-card
                  primary: Stop array
                  icon: mdi:stop-circle-outline
                  tap_action:
                    action: perform-action
                    perform_action: switch.turn_off
                    target:
                      entity_id: switch.tower_array
                    confirmation:
                      text: Stop the Tower array? Array services and containers may be interrupted.
              - type: conditional
                conditions:
                - entity: switch.tower_array
                  state: 'off'
                card:
                  type: custom:mushroom-template-card
                  primary: Start array
                  icon: mdi:nas
                  tap_action:
                    action: perform-action
                    perform_action: switch.turn_on
                    target:
                      entity_id: switch.tower_array
                    confirmation:
                      text: Start the Tower array?
      hold_action:
        action: more-info
        entity: binary_sensor.tower_parity_valid
    - type: custom:button-card
      template: server_status
      name: Storage
      icon: mdi:harddisk
      entity: sensor.tower_array_usage
      variables:
        c_health: |-
          [[[
          const h = variables.b_helpers;

          const faults = ['binary_sensor.tower_disks_disabled','binary_sensor.tower_disks_missing','binary_sensor.tower_disks_invalid','binary_sensor.tower_filesystems_unmountable'];
          const bad = faults.filter(id => h.s(id) === 'on');
          const keys = ['cache','parity','disk1','disk2','disk3','disk4','disk5'];
          const badHealth = keys.filter(k => h.s(`binary_sensor.tower_disk_${k}_health`) === 'on');
          if (bad.length || badHealth.length) return h.health(`${badHealth.length ? badHealth.join(', ').replace(/disk/g,'Disk ') + ' · ' : ''}Disk / filesystem problem`, 'red');
          const diskErrors=keys.filter(k=>k!=='parity' && (h.n(`sensor.tower_disk_${k}_errors`) || 0)>0);
          if(diskErrors.length) return h.health(`${diskErrors.join(', ').replace(/disk/g,'Disk ')} · read/write errors`,'red');
          if (h.s('binary_sensor.tower_array_started') === 'off') return h.health('Array stopped', 'red');
          const capacity = ['cache','disk1','disk2','disk3','disk4','disk5'].map(k => ({k,value:h.n(`sensor.tower_disk_${k}_usage`)}));
          const full = capacity.filter(x => x.value != null && x.value >= (x.k === 'cache' ? 75 : 80)).sort((a,b) => b.value-a.value);
          if (full.length) {const x=full[0];return h.health(`${x.k === 'cache' ? 'Cache' : x.k.replace('disk','Disk ')} · ${h.fmt(x.value,1,'%')} full${full.length > 1 ? ` · +${full.length-1}` : ''}`, x.value >= 90 ? 'red' : 'amber');}
          const hot=keys.map(k=>({k,t:h.n(`sensor.tower_disk_${k}_temperature`)})).filter(x=>x.t!=null && x.t>=45 && (x.k==='cache' || h.s(`switch.tower_disk_${x.k}_spin`)==='on')).sort((a,b)=>b.t-a.t);
          if(hot.length) return h.health(`${hot[0].k==='cache'?'Cache':hot[0].k.replace('disk','Disk ')} · ${h.fmt(hot[0].t,0)} °C`,hot[0].t>=55?'red':'amber');
          const missing = !h.binary('binary_sensor.tower_array_started') || h.n('sensor.tower_array_usage')==null || faults.some(id => !h.binary(id)) || keys.some(k => !h.binary(`binary_sensor.tower_disk_${k}_health`)) || capacity.some(x => x.value == null);
          if (missing) return h.health('Storage status incomplete', 'disabled');
          return h.health(`Array ${h.fmt(h.n('sensor.tower_array_usage'),1,'%')} · Cache ${h.fmt(h.n('sensor.tower_disk_cache_usage'),1,'%')}`);
          ]]]
      triggers_update:
      - binary_sensor.tower_array_started
      - binary_sensor.tower_disk_cache_health
      - binary_sensor.tower_disk_disk1_health
      - binary_sensor.tower_disk_disk2_health
      - binary_sensor.tower_disk_disk3_health
      - binary_sensor.tower_disk_disk4_health
      - binary_sensor.tower_disk_disk5_health
      - binary_sensor.tower_disk_parity_health
      - binary_sensor.tower_disks_disabled
      - binary_sensor.tower_disks_invalid
      - binary_sensor.tower_disks_missing
      - binary_sensor.tower_filesystems_unmountable
      - sensor.time
      - sensor.tower_array_usage
      - sensor.tower_disk_cache_errors
      - sensor.tower_disk_cache_temperature
      - sensor.tower_disk_cache_usage
      - sensor.tower_disk_disk1_errors
      - sensor.tower_disk_disk1_temperature
      - sensor.tower_disk_disk1_usage
      - sensor.tower_disk_disk2_errors
      - sensor.tower_disk_disk2_temperature
      - sensor.tower_disk_disk2_usage
      - sensor.tower_disk_disk3_errors
      - sensor.tower_disk_disk3_temperature
      - sensor.tower_disk_disk3_usage
      - sensor.tower_disk_disk4_errors
      - sensor.tower_disk_disk4_temperature
      - sensor.tower_disk_disk4_usage
      - sensor.tower_disk_disk5_errors
      - sensor.tower_disk_disk5_temperature
      - sensor.tower_disk_disk5_usage
      - sensor.tower_disk_parity_temperature
      - switch.tower_disk_disk1_spin
      - switch.tower_disk_disk2_spin
      - switch.tower_disk_disk3_spin
      - switch.tower_disk_disk4_spin
      - switch.tower_disk_disk5_spin
      - switch.tower_disk_parity_spin
      tap_action:
        action: fire-dom-event
        browser_mod:
          service: browser_mod.popup
          data:
            title: Storage
            content:
              type: vertical-stack
              cards:
              - type: entities
                title: Array and cache
                show_header_toggle: false
                entities:
                - entity: sensor.tower_array_state
                  name: Array state
                - entity: sensor.tower_array_usage
                  name: Array usage
                - entity: sensor.tower_disk_cache_usage
                  name: Cache usage
                - entity: binary_sensor.tower_mover_active
                  name: Mover active
              - type: entities
                title: Disk and filesystem checks
                show_header_toggle: false
                entities:
                - entity: binary_sensor.tower_disks_disabled
                  name: Disabled disks
                - entity: binary_sensor.tower_disks_missing
                  name: Missing disks
                - entity: binary_sensor.tower_disks_invalid
                  name: Invalid disks
                - entity: binary_sensor.tower_filesystems_unmountable
                  name: Unmountable filesystems
              - type: entities
                title: Boot flash
                show_header_toggle: false
                entities:
                - entity: sensor.tower_disk_flash_usage
                  name: Flash usage
                - entity: binary_sensor.tower_disk_flash_health
                  name: Reported flash health
              - type: markdown
                text_only: true
                content: Flash usage and flash health are independent. Unknown health is not a healthy result. Open an individual
                  disk card on the main view for its capacity, temperature, errors and spin controls.
      hold_action:
        action: more-info
        entity: sensor.tower_array_usage
    - type: custom:button-card
      template: server_status
      name: Cooling
      icon: mdi:fan
      entity: sensor.fan_controller_nas_fan_1_speed
      variables:
        c_health: |-
          [[[
          const h = variables.b_helpers;

          const keys=[1,2,3];
          const bad = keys.filter(i => h.s(`binary_sensor.fan_controller_nas_nas_fan_${i}_fault`) === 'on');
          if (bad.length) return h.health(`Fan ${bad.join(', ')} fault`, 'red');
          const stalled = keys.filter(i => h.s(`fan.fan_controller_nas_fan_${i}`) === 'on' && h.n(`sensor.fan_controller_nas_fan_${i}_speed`) === 0);
          if (stalled.length) return h.health(`Fan ${stalled.join(', ')} · 0 RPM`, 'red');
          const missing = keys.some(i => !h.binary(`fan.fan_controller_nas_fan_${i}`) || !h.binary(`binary_sensor.fan_controller_nas_nas_fan_${i}_fault`) || h.n(`sensor.fan_controller_nas_fan_${i}_speed`) == null);
          if (missing) return h.health('Fan monitoring incomplete', 'disabled');
          const spinning=keys.filter(i => h.n(`sensor.fan_controller_nas_fan_${i}_speed`) > 0).length;
          const avg=keys.reduce((a,i)=>a+h.n(`sensor.fan_controller_nas_fan_${i}_speed`),0)/3;
          const disks=['disk1','disk2','disk3','disk4','disk5'];
          const allAsleep=disks.every(k => h.s(`switch.tower_disk_${k}_spin`) === 'off');
          const inputs=h.n('sensor.fan_controller_nas_available_disk_temperature_count');
          if (!allAsleep && (inputs == null || inputs === 0)) return h.health(`${spinning}/3 spinning · temperature inputs missing`, 'amber');
          return h.health(`${spinning}/3 spinning · ${h.fmt(avg,0,' RPM')}${allAsleep ? '\nDisks in standby' : ''}`, spinning === 3 ? 'green' : 'amber');
          ]]]
      triggers_update:
      - binary_sensor.fan_controller_nas_nas_fan_1_fault
      - binary_sensor.fan_controller_nas_nas_fan_2_fault
      - binary_sensor.fan_controller_nas_nas_fan_3_fault
      - fan.fan_controller_nas_fan_1
      - fan.fan_controller_nas_fan_2
      - fan.fan_controller_nas_fan_3
      - sensor.fan_controller_nas_available_disk_temperature_count
      - sensor.fan_controller_nas_fan_1_speed
      - sensor.fan_controller_nas_fan_2_speed
      - sensor.fan_controller_nas_fan_3_speed
      - sensor.time
      - switch.tower_disk_disk1_spin
      - switch.tower_disk_disk2_spin
      - switch.tower_disk_disk3_spin
      - switch.tower_disk_disk4_spin
      - switch.tower_disk_disk5_spin
      tap_action:
        action: fire-dom-event
        browser_mod:
          service: browser_mod.popup
          data:
            title: NAS fan controller
            content:
              type: vertical-stack
              cards:
              - type: markdown
                content: |
                  [Open NAS fan controller device page](/config/devices/device/a12711ab8cab8c27749cfeaae20e0177)

                  Average RPM covers connected fans 1–3, including stopped fans. Unused outputs 4–6 are excluded.

                  Disk-temperature summaries are intentionally unavailable while all data disks are asleep; cache is not a controller input.
              - type: entities
                show_header_toggle: false
                entities:
                - type: section
                  label: Connected fans
                - entity: fan.fan_controller_nas_fan_1
                  name: Fan 1
                - entity: sensor.fan_controller_nas_fan_1_speed
                  name: Fan 1 measured speed
                - entity: binary_sensor.fan_controller_nas_nas_fan_1_fault
                  name: Fan 1 fault
                - entity: fan.fan_controller_nas_fan_2
                  name: Fan 2
                - entity: sensor.fan_controller_nas_fan_2_speed
                  name: Fan 2 measured speed
                - entity: binary_sensor.fan_controller_nas_nas_fan_2_fault
                  name: Fan 2 fault
                - entity: fan.fan_controller_nas_fan_3
                  name: Fan 3
                - entity: sensor.fan_controller_nas_fan_3_speed
                  name: Fan 3 measured speed
                - entity: binary_sensor.fan_controller_nas_nas_fan_3_fault
                  name: Fan 3 fault
                - type: section
                  label: Automatic cooling
                - entity: select.fan_controller_nas_fan_control_mode
                  name: Control mode
                - entity: sensor.fan_controller_nas_automatic_fan_speed
                  name: Automatic target speed
                - entity: sensor.fan_controller_nas_fan_control_temperature
                  name: Control temperature
                - entity: sensor.fan_controller_nas_mean_disk_temperature
                  name: Mean disk temperature
                - entity: sensor.fan_controller_nas_median_disk_temperature
                  name: Median disk temperature
                - entity: sensor.fan_controller_nas_maximum_disk_temperature
                  name: Hottest disk
                - entity: sensor.fan_controller_nas_available_disk_temperature_count
                  name: Available disk temperatures
                - type: section
                  label: Controller diagnostics
                - entity: sensor.fan_controller_nas_12v_rail
                  name: 12V supply
                - entity: sensor.fan_controller_nas_wifi_signal
                  name: Wi-Fi signal
                - entity: sensor.fan_controller_nas_ip
                  name: IP address
                - entity: sensor.fan_controller_nas_esphome_version
                  name: ESPHome version
              - type: history-graph
                title: Fan speeds · last 6 hours
                hours_to_show: 6
                entities:
                - entity: sensor.fan_controller_nas_fan_1_speed
                  name: Fan 1
                - entity: sensor.fan_controller_nas_fan_2_speed
                  name: Fan 2
                - entity: sensor.fan_controller_nas_fan_3_speed
                  name: Fan 3
      hold_action:
        action: more-info
        entity: sensor.fan_controller_nas_fan_1_speed
    - type: custom:button-card
      template: server_status
      name: VPN
      icon: mdi:shield-lock
      entity: sensor.airvpn_connected_since
      variables:
        c_health: |-
          [[[
          const h = variables.b_helpers;

          const id='sensor.airvpn_connected_since';
          const date=Date.parse(h.s(id));
          if (!h.known(id) || !Number.isFinite(date) || date > Date.now()+300000) return h.health('Connection status unavailable', 'disabled');
          const name=h.s('sensor.airvpn_server_name'), country=h.s('sensor.airvpn_server_country');
          if (!h.known('sensor.airvpn_server_name') || !h.known('sensor.airvpn_server_country')) return h.health('Connected · server details unavailable','amber');
          const hours=Math.max(0,Math.floor((Date.now()-date)/3600000));
          return h.health(`${name} · ${country}\nConnected ${hours ? hours+'h' : '<1h'}`);
          ]]]
      triggers_update:
      - sensor.airvpn_connected_since
      - sensor.airvpn_server_country
      - sensor.airvpn_server_name
      - sensor.time
      tap_action:
        action: fire-dom-event
        browser_mod:
          service: browser_mod.popup
          data:
            title: AirVPN
            content:
              type: vertical-stack
              cards:
              - type: entities
                title: AirVPN
                show_header_toggle: false
                entities:
                - entity: sensor.airvpn_server_name
                  name: Server
                - entity: sensor.airvpn_server_country
                  name: Country
                - entity: sensor.airvpn_connected_since
                  name: Connected since
                - entity: sensor.airvpn_exit_ip
                  name: Exit IP
                - entity: sensor.airvpn_vpn_ip
                  name: VPN IP
                - entity: sensor.airvpn_data_downloaded
                  name: Downloaded
                - entity: sensor.airvpn_data_uploaded
                  name: Uploaded
              - type: custom:apexcharts-card
                graph_span: 24h
                update_interval: 1min
                header:
                  show: true
                  title: VPN bandwidth
                  show_states: true
                  colorize_states: true
                apex_config:
                  chart:
                    height: 160
                    animations:
                      enabled: false
                  legend:
                    show: false
                  stroke:
                    curve: straight
                  grid:
                    borderColor: rgba(127,127,127,0.15)
                  tooltip:
                    shared: true
                    intersect: false
                all_series_config:
                  stroke_width: 2
                  float_precision: 1
                  fill_raw: 'null'
                  group_by:
                    func: avg
                    duration: 5min
                    fill: 'null'
                  show:
                    legend_value: false
                series:
                - entity: sensor.airvpn_download_speed
                  name: Download
                  color: '#03a9f4'
                - entity: sensor.airvpn_upload_speed
                  name: Upload
                  color: '#4caf50'
              - type: markdown
                text_only: true
                content: Connection information comes from the AirVPN account endpoint. Missing data means connection status
                  is unknown; it does not independently prove the local tunnel is down.
      hold_action:
        action: more-info
        entity: sensor.airvpn_connected_since
    - type: custom:button-card
      template: server_status
      name: Remote backup
      icon: mdi:server-network
      entity: binary_sensor.rpi4_omv
      variables:
        c_health: |-
          [[[
          const h = variables.b_helpers;

          const ping='binary_sensor.rpi4_omv';
          if (h.s(ping) === 'off') return h.health('Unreachable','red');
          if (!h.binary(ping)) return h.health('Reachability unavailable','disabled');
          const checks=['binary_sensor.rpi4_omv_reachable','binary_sensor.rpi4_omv_disk_1_available','binary_sensor.rpi4_omv_disk_1_read_write','binary_sensor.rpi4_omv_disk_2_available','binary_sensor.rpi4_omv_disk_2_read_write','binary_sensor.rpi4_omv_smb_active','binary_sensor.rpi4_omv_smb_port_445_listening','binary_sensor.rpi4_omv_external_backups_share_available','binary_sensor.rpi4_omv_photos_share_available','binary_sensor.rpi4_omv_backups_share_available','binary_sensor.rpi4_omv_service_active','binary_sensor.rpi4_omv_root_filesystem_read_write'];
          if(checks.some(id=>h.s(id)==='off')) return h.health('Reachable · storage / service problem','red');
          const units=h.n('sensor.rpi4_omv_failed_systemd_units'), errors=h.n('sensor.rpi4_omv_recent_storage_errors');
          if(errors != null && errors > 0) return h.health(`${errors} recent storage errors`,'red');
          if(units != null && units > 0) return h.health(`Reachable · ${units} failed unit${units===1?'':'s'}`,'amber');
          const full=['sensor.rpi4_omv_disk_1_usage','sensor.rpi4_omv_disk_2_usage','sensor.rpi4_omv_root_usage'].map(h.n).filter(v=>v!=null && v>=90);
          if(full.length) return h.health(`Reachable · storage ${Math.max(...full).toFixed(0)}% full`,'amber');
          if(checks.some(id=>!h.binary(id)) || units == null || errors == null) return h.health('Reachable · monitoring incomplete','amber');
          return h.health('Reachable · storage and SMB OK');
          ]]]
      triggers_update:
      - binary_sensor.rpi4_omv
      - binary_sensor.rpi4_omv_backups_share_available
      - binary_sensor.rpi4_omv_disk_1_available
      - binary_sensor.rpi4_omv_disk_1_read_write
      - binary_sensor.rpi4_omv_disk_2_available
      - binary_sensor.rpi4_omv_disk_2_read_write
      - binary_sensor.rpi4_omv_external_backups_share_available
      - binary_sensor.rpi4_omv_photos_share_available
      - binary_sensor.rpi4_omv_reachable
      - binary_sensor.rpi4_omv_root_filesystem_read_write
      - binary_sensor.rpi4_omv_service_active
      - binary_sensor.rpi4_omv_smb_active
      - binary_sensor.rpi4_omv_smb_port_445_listening
      - sensor.rpi4_omv_disk_1_usage
      - sensor.rpi4_omv_disk_2_usage
      - sensor.rpi4_omv_failed_systemd_units
      - sensor.rpi4_omv_recent_storage_errors
      - sensor.rpi4_omv_root_usage
      - sensor.time
      tap_action:
        action: fire-dom-event
        browser_mod:
          service: browser_mod.popup
          data:
            title: Remote backup server
            content:
              type: vertical-stack
              cards:
              - type: markdown
                text_only: true
                content: Reachability and share health do not confirm that a backup completed. No backup-success timestamp
                  is currently available here.
              - type: entities
                show_header_toggle: false
