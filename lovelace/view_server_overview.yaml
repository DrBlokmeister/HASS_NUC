          if(h.s('binary_sensor.tower_ups_connected')==='off') return h.health('UPS disconnected','red');
          if(!String(s).toUpperCase().includes('ONLINE')) return h.health(`${s} · ${h.s('sensor.tower_ups_runtime') || 'runtime unavailable'}`,'red');
