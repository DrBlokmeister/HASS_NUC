  - type: custom:collapsable-cards
    title: Reload Shelly Devices
    defaultOpen: false
    cards:
      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.ping_shelly_baby_room_round_trip_time_average
            primary: Baby Room
            secondary: >-
              {%- set ping = states(entity) -%}
              {{ ping | float(0) | round(0) }} ms
            icon: mdi:reload
            icon_color: >-
              {%- set ping = states(entity) | float(9999) -%}
              {%- if ping > 500 -%}
                red
              {%- elif ping > 150 -%}
                amber
              {%- else -%}
                blue
              {%- endif -%}
            fill_container: true
            tap_action:
              action: call-service
              service: homeassistant.reload_config_entry
              target:
                device_id: 4be973a29c599ad17986cb9d9cc78e7a
            hold_action:
              action: more-info
            card_mod:
              style: |
                ha-card {
                  min-height: 68px;
                }
          - type: custom:mushroom-template-card
            entity: sensor.ping_shelly_backgarden_round_trip_time_average
            primary: Back Garden
            secondary: >-
              {%- set ping = states(entity) -%}
