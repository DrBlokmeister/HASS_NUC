  ###########################################################################
  # PARITY / ARRAY CONTROL
  ###########################################################################
  - type: custom:collapsable-cards
    title: Parity and array
    cards:
      - type: gauge
        entity: sensor.tower_parity_check_progress
        name: Parity check progress
        min: 0
        max: 100
        severity:
          green: 0
          yellow: 1
          red: 95

      - type: custom:mushroom-template-card
        entity: switch.tower_parity_check
        primary: Unraid parity check
        secondary: >-
          {% set status = state_attr('switch.tower_parity_check', 'status') | default('unknown', true) %}
          {% set progress = state_attr('switch.tower_parity_check', 'progress') | default(states('sensor.tower_parity_check_progress'), true) %}
          {% set speed = states('sensor.tower_parity_check_speed') %}
          {% set errors = state_attr('switch.tower_parity_check', 'errors') %}
          {% if status == 'running' %}
            Running · {{ progress }}% · {{ speed }} MiB/s
          {% elif status == 'paused' %}
            Paused · {{ progress }}% · {{ speed }} MiB/s
          {% elif status == 'stopped' %}
            Stopped
          {% else %}
            {{ status | replace('_', ' ') | title }}{% if progress not in ['unknown', 'unavailable', '', none] %} · {{ progress }}%{% endif %}
          {% endif %}
          {% if errors not in [none, 'None', 'unknown', 'unavailable'] %}
            · Errors: {{ errors }}
          {% endif %}
        icon: mdi:shield-sync
        icon_color: >-
          {% set status = state_attr('switch.tower_parity_check', 'status') | default('unknown', true) %}
          {% set errors = state_attr('switch.tower_parity_check', 'errors') %}
          {% if errors not in [none, 'None', 'unknown', 'unavailable'] and errors | int(0) > 0 %}
            red
          {% elif status == 'running' %}
            green
          {% elif status == 'paused' %}
            amber
          {% elif status == 'stopped' %}
            blue
          {% else %}
            disabled
          {% endif %}
        multiline_secondary: true
        tap_action:
          action: more-info

      - type: entities
        title: Parity status
        show_header_toggle: false
        entities:
          - entity: binary_sensor.tower_parity_check_running
            name: Running
          - entity: sensor.tower_parity_check_progress
            name: Progress
          - entity: sensor.tower_parity_check_speed
            name: Speed
          - entity: binary_sensor.tower_parity_status
            name: Status
          - entity: binary_sensor.tower_parity_valid
            name: Valid
          - entity: sensor.tower_last_parity_check_errors
            name: Last parity check errors

      - type: grid
        square: false
        columns: 3
        cards:
          ############################################################
          # PARITY PAUSE / RESUME / CORRECTING BUTTONS
          ############################################################

          - type: custom:mushroom-template-card
            entity: button.tower_pause_parity_check
            primary: Pause parity
            secondary: Pause running check
            icon: mdi:pause-circle-outline
            icon_color: amber
            layout: vertical
            fill_container: true
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.tower_pause_parity_check
              confirmation:
                text: Pause the currently running parity check?
            hold_action:
              action: more-info

          - type: custom:mushroom-template-card
            entity: button.tower_resume_parity_check
            primary: Resume parity
            secondary: Continue paused check
            icon: mdi:play-circle-outline
            icon_color: green
            layout: vertical
            fill_container: true
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.tower_resume_parity_check
              confirmation:
                text: Resume the paused parity check?
            hold_action:
              action: more-info

          - type: custom:mushroom-template-card
            entity: button.tower_parity_check_correcting
            primary: Correct parity
            secondary: Write corrections
            icon: mdi:shield-sync-outline
            icon_color: red
            layout: vertical
            fill_container: true
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.tower_parity_check_correcting
              confirmation:
                text: >-
                  Start a CORRECTING parity check? This may WRITE corrections
                  to the parity disk if sync errors are found.
            hold_action:
              action: more-info

          - type: conditional
            conditions:
              - condition: state
                entity: switch.tower_parity_check
                state: "off"
            card:
              type: custom:mushroom-template-card
              entity: switch.tower_parity_check
              primary: Start parity
              secondary: Non-correcting check
              icon: mdi:shield-search
              icon_color: red
              layout: vertical
              fill_container: true
              tap_action:
                action: perform-action
                perform_action: switch.turn_on
                target:
                  entity_id: switch.tower_parity_check
                confirmation:
                  text: >-
                    Start a NON-CORRECTING parity check? This will read all array
                    disks and may heavily affect disk performance.
              hold_action:
                action: more-info
          - type: conditional
            conditions:
              - condition: state
                entity: switch.tower_parity_check
                state: "on"
            card:
              type: custom:mushroom-template-card
              entity: switch.tower_parity_check
              primary: Stop parity
              secondary: Cancel running check
              icon: mdi:shield-off-outline
              icon_color: green
              layout: vertical
              fill_container: true
              tap_action:
                action: perform-action
                perform_action: switch.turn_off
                target:
                  entity_id: switch.tower_parity_check
                confirmation:
                  text: >-
                    WARNING! This will STOP/CANCEL the running parity check,
                    not pause it. Are you sure?
              hold_action:
                action: more-info

          - type: conditional
            conditions:
              - condition: state
                entity: switch.tower_array
                state: "off"
            card:
              type: custom:mushroom-template-card
              entity: switch.tower_array
              primary: Start array
              secondary: Bring array online
              icon: mdi:nas
              icon_color: red
              layout: vertical
              fill_container: true
              tap_action:
                action: perform-action
                perform_action: switch.turn_on
                target:
                  entity_id: switch.tower_array
                confirmation:
                  text: Start the Unraid array?
              hold_action:
                action: more-info
          - type: conditional
            conditions:
              - condition: state
                entity: switch.tower_array
                state: "on"
            card:
              type: custom:mushroom-template-card
              entity: switch.tower_array
              primary: Stop array
              secondary: Stops all array services
              icon: mdi:nas
              icon_color: green
              layout: vertical
              fill_container: true
              tap_action:
                action: perform-action
                perform_action: switch.turn_off
                target:
                  entity_id: switch.tower_array
                confirmation:
                  text: >-
                    WARNING! THIS WILL STOP THE ARRAY! Docker containers, shares,
                    and array-backed services may go offline. Are you sure?
              hold_action:
                action: more-info
