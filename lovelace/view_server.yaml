##########################################  HERE BEGINS THE SERVER TAB  ##########################################
# Reworked for stronger failure visibility, cleaner grouping, and better accessibility.
# Notes:
# - This keeps the existing remote backup / AirVPN / PiKVM / firewall / desk powerstrip sections.
# - Container resource cards use current Unraid per-container sensors; history charts auto-discover matching entities.
# - The old Unraid switch entities are replaced by the newer tower_* entities from the current Unraid integration.
# - Parity ETA uses graceful fallback text because no clear ETA entity is currently exposed.

title: Server monitor
path: server-monitor
icon: mdi:server-network
panel: false
badges: []

cards:
  ###########################################################################
  # TOP PRIORITY / "OH SHIT" SECTION
  ###########################################################################
  - type: markdown
    content: |
      ## Critical status
      [Unraid Device Page](/config/devices/device/db9950b8bef71e0918844cce1953eeb5)

  # NAS fans 1-3 are connected; unused outputs 4-6 are excluded from the average.
  - type: custom:mushroom-template-card
    entity: fan.fan_controller_nas_fan_1
    primary: NAS cooling fans
    secondary: >-
      {% set fans = expand('fan.fan_controller_nas_fan_1', 'fan.fan_controller_nas_fan_2', 'fan.fan_controller_nas_fan_3') | list %}
      {% set on = fans | selectattr('state', 'eq', 'on') | list | count %}
      {% set known = fans | selectattr('state', 'in', ['on', 'off']) | list | count %}
      {% set rpm = [states('sensor.fan_controller_nas_fan_1_speed'), states('sensor.fan_controller_nas_fan_2_speed'), states('sensor.fan_controller_nas_fan_3_speed')] %}
      {% set valid = rpm | select('is_number') | list %}
      {% if known != 3 %}
        {{ on }}/3 fans on · Status incomplete
      {% elif on == 0 %}
        All fans off
      {% else %}
        {{ on }}/3 fans on
      {% endif %}
      · {% if valid | count == 3 %}{{ valid | map('float') | average | round(0) | int }} RPM average{% else %}Average RPM unavailable{% endif %}
    icon: mdi:fan
    icon_color: >-
      {% set faults = expand('binary_sensor.fan_controller_nas_nas_fan_1_fault', 'binary_sensor.fan_controller_nas_nas_fan_2_fault', 'binary_sensor.fan_controller_nas_nas_fan_3_fault') | list %}
      {% set fans = expand('fan.fan_controller_nas_fan_1', 'fan.fan_controller_nas_fan_2', 'fan.fan_controller_nas_fan_3') | list %}
      {% if faults | selectattr('state', 'eq', 'on') | list | count > 0 %}
        red
      {% elif fans | selectattr('state', 'in', ['on', 'off']) | list | count != 3 %}
        disabled
      {% elif [states('sensor.fan_controller_nas_fan_1_speed'), states('sensor.fan_controller_nas_fan_2_speed'), states('sensor.fan_controller_nas_fan_3_speed')] | select('is_number') | list | count != 3 %}
        amber
      {% elif fans | selectattr('state', 'eq', 'on') | list | count > 0 %}
        green
      {% else %}
        disabled
      {% endif %}
    multiline_secondary: true
    fill_container: true
    hold_action:
      action: navigate
      navigation_path: /config/devices/device/a12711ab8cab8c27749cfeaae20e0177
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: NAS fan controller
          content:
            type: vertical-stack
            cards:
              - type: markdown
                content: |
                  [Open NAS fan controller device page](/config/devices/device/a12711ab8cab8c27749cfeaae20e0177)

                  Average RPM covers connected fans 1–3, including stopped fans. Unused outputs 4–6 are excluded.
              - type: entities
                show_header_toggle: false
                entities:
                  - type: section
                    label: Connected fans
                  - entity: fan.fan_controller_nas_fan_1
                    name: Fan 1
                  - entity: sensor.fan_controller_nas_fan_1_speed
                    name: Fan 1 measured speed
                  - entity: binary_sensor.fan_controller_nas_nas_fan_1_fault
                    name: Fan 1 fault
                  - entity: fan.fan_controller_nas_fan_2
                    name: Fan 2
                  - entity: sensor.fan_controller_nas_fan_2_speed
                    name: Fan 2 measured speed
                  - entity: binary_sensor.fan_controller_nas_nas_fan_2_fault
                    name: Fan 2 fault
                  - entity: fan.fan_controller_nas_fan_3
                    name: Fan 3
                  - entity: sensor.fan_controller_nas_fan_3_speed
                    name: Fan 3 measured speed
                  - entity: binary_sensor.fan_controller_nas_nas_fan_3_fault
                    name: Fan 3 fault
                  - type: section
                    label: Automatic cooling
                  - entity: select.fan_controller_nas_fan_control_mode
                    name: Control mode
                  - entity: sensor.fan_controller_nas_automatic_fan_speed
                    name: Automatic target speed
                  - entity: sensor.fan_controller_nas_fan_control_temperature
                    name: Control temperature
                  - entity: sensor.fan_controller_nas_mean_disk_temperature
                    name: Mean disk temperature
                  - entity: sensor.fan_controller_nas_median_disk_temperature
                    name: Median disk temperature
                  - entity: sensor.fan_controller_nas_maximum_disk_temperature
                    name: Hottest disk
                  - entity: sensor.fan_controller_nas_available_disk_temperature_count
                    name: Available disk temperatures
                  - type: section
                    label: Controller diagnostics
                  - entity: sensor.fan_controller_nas_12v_rail
                    name: 12V supply
                  - entity: sensor.fan_controller_nas_wifi_signal
                    name: Wi-Fi signal
                  - entity: sensor.fan_controller_nas_ip
                    name: IP address
                  - entity: sensor.fan_controller_nas_esphome_version
                    name: ESPHome version
              - type: history-graph
                title: Fan speeds · last 6 hours
                hours_to_show: 6
                entities:
                  - entity: sensor.fan_controller_nas_fan_1_speed
                    name: Fan 1
                  - entity: sensor.fan_controller_nas_fan_2_speed
                    name: Fan 2
                  - entity: sensor.fan_controller_nas_fan_3_speed
                    name: Fan 3

  - type: conditional
    conditions:
      - condition: or
        conditions:
          - condition: and
            conditions:
              - entity: sensor.tower_unraid_version
                state: unavailable
              - entity: sensor.tower_array_state
                state: unavailable
              - entity: sensor.tower_cpu_usage
                state: unavailable
          - condition: and
            conditions:
              - entity: sensor.tower_unraid_version
                state: unknown
              - entity: sensor.tower_array_state
                state: unknown
              - entity: sensor.tower_cpu_usage
                state: unknown
    card:
      type: custom:mushroom-template-card
      primary: Unraid integration unavailable
      secondary: >-
        Most Unraid data on this page is currently unavailable. Check the integration or device page.
      icon: mdi:lan-disconnect
      icon_color: red
      multiline_secondary: true
      tap_action:
        action: navigate
        navigation_path: /config/integrations/integration/unraid#config_entry=01KE9FC8WHW9JCTV72W3CXQQDC
      hold_action:
        action: navigate
        navigation_path: /config/devices/device/db9950b8bef71e0918844cce1953eeb5
  - type: grid
    square: false
    columns: 2
    cards:
      - type: custom:mushroom-template-card
        entity: sensor.tower_last_parity_check_errors
        primary: Parity integrity
        secondary: >-
          {% set s = states('sensor.tower_last_parity_check_errors') %}
          {% set running = is_state('binary_sensor.tower_parity_check_running', 'on') %}
          {% set parity_problem = is_state('binary_sensor.tower_parity_status', 'on') and not running %}
          {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
            Unavailable
          {% elif s | int(0) > 0 %}
            {{ s | int(0) }} parity error{{ 's' if s | int(0) != 1 else '' }} detected
          {% elif parity_problem %}
            Parity status reports a problem
          {% elif running %}
            Check running · {{ states('sensor.tower_parity_check_progress') }}%
          {% else %}
            No parity errors reported
          {% endif %}
        icon: mdi:shield-alert
        icon_color: >-
          {% set s = states('sensor.tower_last_parity_check_errors') %}
          {% set running = is_state('binary_sensor.tower_parity_check_running', 'on') %}
          {% set parity_problem = is_state('binary_sensor.tower_parity_status', 'on') and not running %}
          {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
            disabled
          {% elif s | int(0) > 0 or parity_problem %}
            red
          {% elif running %}
            amber
          {% else %}
            green
          {% endif %}
        multiline_secondary: true
        fill_container: true
        tap_action:
          action: more-info

      - type: custom:mushroom-template-card
        entity: sensor.tower_array_state
        primary: Array state
        secondary: >-
          {% set s = states('sensor.tower_array_state') %}
          {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
            Unavailable
          {% elif is_state('binary_sensor.tower_array_started', 'on') %}
            Started · {{ states('sensor.tower_array_usage') | float(0) | round(1) }}% used
          {% else %}
            Array is stopped
          {% endif %}
        icon: mdi:harddisk
        icon_color: >-
          {% set s = states('sensor.tower_array_state') %}
          {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
            disabled
          {% elif is_state('binary_sensor.tower_array_started', 'on') %}
            green
          {% else %}
            red
          {% endif %}
        fill_container: true
        tap_action:
          action: more-info

      - type: custom:mushroom-template-card
        entity: binary_sensor.rpi4_omv
        primary: Remote backup server
        secondary: >-
          {% if is_state('binary_sensor.rpi4_omv', 'on') %}
            Reachable · RTT {{ states('sensor.rpi4_omv_round_trip_time_average') }}
          {% else %}
            Remote backup server is unreachable
          {% endif %}
        icon: mdi:server-network
        icon_color: >-
          {% if is_state('binary_sensor.rpi4_omv', 'on') %}
            green
          {% else %}
            red
          {% endif %}
        multiline_secondary: true
        fill_container: true
        tap_action:
          action: more-info

      - type: custom:mushroom-template-card
        entity: sensor.airvpn_connected_since
        primary: VPN status
        secondary: >-
          {%- set s = states('sensor.airvpn_connected_since') -%}
          {%- if s in ['unknown', 'unavailable', 'none', 'None', ''] -%}
            VPN appears disconnected
          {%- else -%}
            Connected {{ relative_time(as_datetime(s)) }} ago
          {%- endif -%}
        icon: mdi:shield-lock
        icon_color: >-
          {% set s = states('sensor.airvpn_connected_since') %}
          {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
            red
          {% else %}
            green
          {% endif %}
        multiline_secondary: true
        fill_container: true
        tap_action:
          action: more-info

      - type: custom:mushroom-template-card
        entity: binary_sensor.pikvm_nas
        primary: PiKVM NAS
        secondary: >-
          {% if is_state('binary_sensor.pikvm_nas', 'on') %}
            Reachable · RTT {{ states('sensor.pikvm_nas_round_trip_time_average') }}
          {% else %}
            PiKVM is unreachable
          {% endif %}
        icon: mdi:kvm
        icon_color: >-
          {% if is_state('binary_sensor.pikvm_nas', 'on') %}
            green
          {% else %}
            red
          {% endif %}
        fill_container: true
        tap_action:
          action: more-info

      - type: custom:mushroom-template-card
        entity: sensor.tower_disk_cache_usage
        primary: Cache usage
        secondary: >-
          {% set s = states('sensor.tower_disk_cache_usage') %}
          {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
            Unavailable
          {% else %}
            {{ s | float(0) | round(1) }}% used ·
            {{ state_attr('sensor.tower_disk_cache_usage', 'used') }} / {{ state_attr('sensor.tower_disk_cache_usage', 'total') }}
          {% endif %}
        icon: mdi:harddisk-plus
        icon_color: >-
          {% set s = states('sensor.tower_disk_cache_usage') %}
          {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
            disabled
          {% elif s | float(0) >= 90 %}
            red
          {% elif s | float(0) >= 80 %}
            amber
          {% else %}
            green
          {% endif %}
        multiline_secondary: true
        fill_container: true
        tap_action:
          action: more-info

      - type: custom:mushroom-template-card
        entity: binary_sensor.tower_parity_check_running
        primary: Parity check
        secondary: >-
          {% set s = states('binary_sensor.tower_parity_check_running') %}
          {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
            Unavailable
          {% elif s == 'on' %}
            Running · {{ states('sensor.tower_parity_check_progress') }}% · {{ states('sensor.tower_parity_check_speed') }} MiB/s
          {% else %}
            Not running
          {% endif %}
        icon: mdi:shield-sync
        icon_color: >-
          {% set s = states('binary_sensor.tower_parity_check_running') %}
          {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
            disabled
          {% elif s == 'on' %}
            amber
          {% else %}
            disabled
          {% endif %}
        fill_container: true
        tap_action:
          action: more-info

      - type: custom:mushroom-template-card
        entity: binary_sensor.tower_disks_invalid
        primary: Disk / FS issues
        secondary: >-
          {% set s = states('binary_sensor.tower_disks_invalid') %}
          {% set disabled = state_attr('binary_sensor.tower_disks_disabled', 'count') | int(0) %}
          {% set invalid = state_attr('binary_sensor.tower_disks_invalid', 'count') | int(0) %}
          {% set missing = state_attr('binary_sensor.tower_disks_missing', 'count') | int(0) %}
          {% set unmountable = state_attr('binary_sensor.tower_filesystems_unmountable', 'count') | int(0) %}
          {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
            Unavailable
          {% elif disabled + invalid + missing + unmountable > 0 %}
            {{ disabled }} disabled · {{ invalid }} invalid · {{ missing }} missing · {{ unmountable }} unmountable
          {% else %}
            No disk or filesystem issues reported
          {% endif %}
        icon: mdi:harddisk-remove
        icon_color: >-
          {% set s = states('binary_sensor.tower_disks_invalid') %}
          {% set disabled = state_attr('binary_sensor.tower_disks_disabled', 'count') | int(0) %}
          {% set invalid = state_attr('binary_sensor.tower_disks_invalid', 'count') | int(0) %}
          {% set missing = state_attr('binary_sensor.tower_disks_missing', 'count') | int(0) %}
          {% set unmountable = state_attr('binary_sensor.tower_filesystems_unmountable', 'count') | int(0) %}
          {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
            disabled
          {% elif disabled + invalid + missing + unmountable > 0 %}
            red
          {% else %}
            green
          {% endif %}
        multiline_secondary: true
        fill_container: true
        tap_action:
          action: more-info

  - type: conditional
    conditions:
      - entity: binary_sensor.tower_parity_check_running
        state: 'on'
    card:
      type: vertical-stack
      cards:
        - type: custom:button-card
          entity: sensor.tower_parity_check_progress
          name: Parity Check Progress
          show_icon: false
          show_state: false
          styles:
            grid:
              - grid-template-areas: '"n" "bar" "info"'
              - grid-template-columns: 1fr
              - grid-template-rows: min-content 18px min-content
              - row-gap: 10px
            card:
              - padding: 14px
            name:
              - justify-self: start
              - font-size: 1.0em
              - font-weight: 600
            custom_fields:
              bar:
                - position: relative
                - height: 18px
                - background: rgba(255,255,255,0.10)
                - border-radius: 999px
                - overflow: hidden
              info:
                - justify-self: stretch
                - text-align: left
                - font-size: 0.95em
                - line-height: 1.45
          custom_fields:
            bar: |
              [[[ 
                const progress = Number(states['sensor.tower_parity_check_progress']?.state || 0);
                const safeProgress = Math.max(0, Math.min(progress, 100));
                return `
                  <div style="position:absolute; inset:0; border-radius:999px; overflow:hidden;">
                    <div style="width:${safeProgress}%; height:100%; background:linear-gradient(90deg, #1e88e5 0%, #42a5f5 100%);"></div>
                  </div>
                  <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:0.82em; color:white; text-shadow:0 1px 2px rgba(0,0,0,0.6);">
                    ${safeProgress.toFixed(0)}%
                  </div>
                `;
              ]]]
            info: |
              [[[ 
                const speed = states['sensor.tower_parity_check_speed']?.state ?? '-';
                const eta = states['sensor.tower_parity_check_finish']?.state
                  ?? states['sensor.tower_parity_estimated_finish']?.state
                  ?? states['sensor.tower_parity_finish_time']?.state
                  ?? 'ETA unavailable';
                return `Speed ${speed} MiB/s · ETA ${eta}`;
              ]]]
        - type: horizontal-stack
          cards:
            - type: custom:button-card
              entity: button.tower_resume_parity_check
              name: Resume parity
              icon: mdi:play
              show_state: false
              tap_action:
                action: toggle
              hold_action:
                action: more-info
              styles:
                card:
                  - padding: 6px 10px
                  - height: 68px
                  - min-height: 68px
                  - border-radius: 14px
                  - background-color: >
                      [[[
                        const status = states['switch.tower_parity_check']?.attributes?.status;
                        return status === 'paused'
                          ? 'rgba(255,255,255,0.92)'
                          : 'rgba(120,120,120,0.22)';
                      ]]]
                  - border: >
                      [[[
                        const status = states['switch.tower_parity_check']?.attributes?.status;
                        return status === 'paused'
                          ? '1px solid rgba(255,255,255,0.95)'
                          : '1px solid rgba(158,158,158,0.28)';
                      ]]]
                icon:
                  - color: >
                      [[[
                        const status = states['switch.tower_parity_check']?.attributes?.status;
                        return status === 'paused' ? 'rgb(20,20,20)' : 'rgb(189,189,189)';
                      ]]]
                  - width: 22px
                name:
                  - font-size: 0.9em
                  - font-weight: 600
                  - color: >
                      [[[
                        const status = states['switch.tower_parity_check']?.attributes?.status;
                        return status === 'paused' ? 'rgb(20,20,20)' : 'rgb(189,189,189)';
                      ]]]
            - type: custom:mushroom-template-card
              entity: switch.tower_parity_check
              primary: Unraid parity check
              secondary: >-
                {% set status = state_attr('switch.tower_parity_check', 'status') | default('unknown', true) %}
                {% set progress = state_attr('switch.tower_parity_check', 'progress') | default(states('sensor.tower_parity_check_progress'), true) %}
                {% set speed = states('sensor.tower_parity_check_speed') %}
                {% set errors = state_attr('switch.tower_parity_check', 'errors') %}
                {% if status == 'running' %}
                  Running · {{ progress }}% · {{ speed }} MiB/s
                {% elif status == 'paused' %}
                  Paused · {{ progress }}% · {{ speed }} MiB/s
                {% elif status == 'stopped' %}
                  Stopped
                {% else %}
                  {{ status | replace('_', ' ') | title }}{% if progress not in ['unknown', 'unavailable', '', none] %} · {{ progress }}%{% endif %}
                {% endif %}
                {% if errors not in [none, 'None', 'unknown', 'unavailable'] %}
                  · Errors: {{ errors }}
                {% endif %}
              icon: mdi:shield-sync
              icon_color: >-
                {% set status = state_attr('switch.tower_parity_check', 'status') | default('unknown', true) %}
                {% set errors = state_attr('switch.tower_parity_check', 'errors') %}
                {% if errors not in [none, 'None', 'unknown', 'unavailable'] and errors | int(0) > 0 %}
                  red
                {% elif status == 'running' %}
                  green
                {% elif status == 'paused' %}
                  amber
                {% elif status == 'stopped' %}
                  blue
                {% else %}
                  disabled
                {% endif %}
              multiline_secondary: true
              tap_action:
                action: more-info

  ###########################################################################
  # OVERVIEW
  ###########################################################################
  - type: markdown
    content: |
      ## Overview

  - type: grid
    square: false
    columns: 2
    cards:
      - type: custom:mushroom-template-card
        entity: sensor.tower_unraid_version
        primary: Unraid version
        secondary: >-
          {% set s = states('sensor.tower_unraid_version') %}
          {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
            Unavailable
          {% else %}
            {{ s }} · API {{ state_attr('sensor.tower_unraid_version', 'api_version') }}
          {% endif %}
        icon: mdi:server
        icon_color: >-
          {% if states('sensor.tower_unraid_version') in ['unknown', 'unavailable', 'none', 'None', ''] %}
            disabled
          {% else %}
            blue
          {% endif %}
        fill_container: true

      - type: custom:mushroom-template-card
        entity: sensor.tower_uptime_2
        primary: Up since
        secondary: >-
          {%- set s = states('sensor.tower_uptime_2') -%}
          {%- if s in ['unknown', 'unavailable', 'none', 'None', ''] -%}
            Unavailable
          {%- else -%}
            Up {{ relative_time(as_datetime(s)) }}
          {%- endif -%}
        icon: mdi:clock-start
        icon_color: >-
          {% if states('sensor.tower_uptime_2') in ['unknown', 'unavailable', 'none', 'None', ''] %}
            disabled
          {% else %}
            green
          {% endif %}
        fill_container: true

      - type: custom:mushroom-template-card
        entity: sensor.tower_array_state
        primary: Array state
        secondary: >-
          {% set s = states('sensor.tower_array_state') %}
          {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
            Unavailable
          {% elif is_state('binary_sensor.tower_array_started', 'on') %}
            Started
          {% else %}
            Stopped
          {% endif %}
        icon: mdi:harddisk
        icon_color: >-
          {% set s = states('sensor.tower_array_state') %}
          {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
            disabled
          {% elif is_state('binary_sensor.tower_array_started', 'on') %}
            green
          {% else %}
            red
          {% endif %}
        fill_container: true

      - type: custom:mushroom-template-card
        entity: sensor.tower_array_usage
        primary: Array usage
        secondary: >-
          {% set s = states('sensor.tower_array_usage') %}
          {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
            Unavailable
          {% else %}
            {{ s | float(0) | round(1) }}% · {{ state_attr('sensor.tower_array_usage', 'used') }} / {{ state_attr('sensor.tower_array_usage', 'total') }}
          {% endif %}
        icon: mdi:harddisk-plus
        icon_color: >-
          {% set s = states('sensor.tower_array_usage') %}
          {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
            disabled
          {% elif s | float(0) >= 90 %}
            red
          {% elif s | float(0) >= 80 %}
            amber
          {% else %}
            green
          {% endif %}
        fill_container: true
        multiline_secondary: true

      - type: custom:mushroom-template-card
        entity: sensor.tower_active_notifications
        primary: Active notifications
        secondary: >-
          {% set s = states('sensor.tower_active_notifications') %}
          {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
            Unavailable
          {% else %}
            {{ s }} active
          {% endif %}
        icon: mdi:bell-badge
        icon_color: >-
          {% set s = states('sensor.tower_active_notifications') %}
          {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
            disabled
          {% elif s | int(0) > 0 %}
            amber
          {% else %}
            green
          {% endif %}
        fill_container: true

      - type: custom:mushroom-template-card
        entity: binary_sensor.tower_mover_active
        primary: Mover
        secondary: >-
          {% set s = states('binary_sensor.tower_mover_active') %}
          {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
            Unavailable
          {% elif s == 'on' %}
            Running
          {% else %}
            Idle
          {% endif %}
        icon: mdi:swap-horizontal-bold
        icon_color: >-
          {% set s = states('binary_sensor.tower_mover_active') %}
          {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
            disabled
          {% elif s == 'on' %}
            amber
          {% else %}
            green
          {% endif %}
        fill_container: true

      - type: custom:mushroom-template-card
        entity: binary_sensor.tower_cloud_connected
        primary: Cloud relay
        secondary: >-
          {% set s = states('binary_sensor.tower_cloud_connected') %}
