  ###########################################################################
  # SYSTEM CHARTS
  ###########################################################################
  - type: markdown
    content: |
      ## System charts

  - type: custom:apexcharts-card
    header:
      title: NAS CPU Stats
      show: true
      show_states: true
      colorize_states: true
    update_interval: 5min
    graph_span: 24h
    apex_config:
      chart:
        height: 250px
      legend:
        show: false
    all_series_config:
      group_by:
        func: median
        duration: 10min
      stroke_width: 3
    yaxis:
      - id: percent
        min: 0
        max: 100
        decimals: 0
        align_to: 10
        apex_config:
          forceNiceScale: true
          labels:
            formatter: |
              EVAL:function(value) {
                return `${value} %`;
              }
      - id: temp
        min: 20
        max: 80
        decimals: 0
        opposite: true
        apex_config:
          forceNiceScale: true
          labels:
            formatter: |
              EVAL:function(value) {
                return `${value} °C`;
              }
    series:
      - entity: sensor.tower_cpu_usage
        name: CPU Usage
        yaxis_id: percent
        color: '#36A2EB'
      - entity: sensor.tower_cpu_temperature
        name: CPU Temperature
        yaxis_id: temp
        color: '#FFCE56'
      - entity: sensor.nas_exhaust_multi_sensor_temperature
        name: Exhaust Temperature
        yaxis_id: temp
        color: '#FF6384'

  - type: custom:apexcharts-card
    header:
      title: NAS Memory Usage
      show: true
      show_states: true
      colorize_states: true
    update_interval: 5min
    graph_span: 24h
    apex_config:
      chart:
        height: 250px
      legend:
        show: false
    all_series_config:
      group_by:
        func: median
        duration: 10min
      stroke_width: 3
    yaxis:
      - min: 0
        max: 100
        decimals: 0
        apex_config:
          forceNiceScale: true
          tickAmount: 4
          labels:
            formatter: |
              EVAL:function(value) {
                return `${value} %`;
              }
    series:
      - entity: sensor.tower_ram_usage
        name: Used Memory
        color: '#FF9F40'

  - type: custom:apexcharts-card
    header:
      title: NAS Disk Temperatures
      show: true
      show_states: true
      colorize_states: true
    update_interval: 5min
    graph_span: 24h
    apex_config:
      chart:
        height: 350px
      legend:
        show: false
    all_series_config:
      group_by:
        func: median
        duration: 5min
      stroke_width: 3
      transform: "return x == -1 ? null : x;"
    yaxis:
      - min: 20
        max: 50
        decimals: 0
        align_to: 10
        apex_config:
          forceNiceScale: true
          labels:
            formatter: |
              EVAL:function(value) {
                return `${value} °C`;
              }
    series:
      - entity: sensor.tower_disk_parity_temperature
        name: Parity Disk Temperature
        color: '#4BC0C0'
      - entity: sensor.tower_disk_disk1_temperature
        name: Disk 1 Temperature
        color: '#9966FF'
      - entity: sensor.tower_disk_disk2_temperature
        name: Disk 2 Temperature
        color: '#C9CBCF'
      - entity: sensor.tower_disk_disk3_temperature
        name: Disk 3 Temperature
        color: '#7E57C2'
      - entity: sensor.tower_disk_disk4_temperature
        name: Disk 4 Temperature
        color: '#FFCE56'
      - entity: sensor.tower_disk_disk5_temperature
        name: Disk 5 Temperature
        color: '#FF9F40'
      - entity: sensor.tower_disk_cache_temperature
        name: Cache Temperature
        color: '#36A2EB'
      - entity: sensor.nas_exhaust_multi_sensor_temperature
        name: Exhaust Temperature
        color: '#FF6384'

  - type: custom:apexcharts-card
    header:
      title: NAS Power
      show: true
      show_states: true
      colorize_states: true
    update_interval: 5min
    graph_span: 24h
    span:
      start: day
    now:
      show: true
    apex_config:
      chart:
        height: 350px
      legend:
        show: false
    all_series_config:
      group_by:
        func: avg
        duration: 5min
      stroke_width: 3
      show:
        in_header: false
        legend_value: false
        name_in_header: false
    yaxis:
      - min: 0
        max: ~80
        decimals: 0
        align_to: 20
        apex_config:
          forceNiceScale: true
    series:
      - entity: sensor.plug_nas_power
        offset: '-6d'
        name: 6 Days Ago
        color: '#DD2C00'
        opacity: 0.2
      - entity: sensor.plug_nas_power
        offset: '-5d'
        name: 5 Days Ago
        color: '#E65100'
        opacity: 0.25
      - entity: sensor.plug_nas_power
        offset: '-4d'
        name: 4 Days Ago
        color: '#EF6C00'
        opacity: 0.3
      - entity: sensor.plug_nas_power
        offset: '-3d'
        name: 3 Days Ago
        color: '#F57C00'
        opacity: 0.35
      - entity: sensor.plug_nas_power
        offset: '-2d'
        name: 2 Days Ago
        color: '#FB8C00'
        opacity: 0.4
      - entity: sensor.plug_nas_power
        offset: '-1d'
        name: Yesterday
        color: '#FFA726'
        opacity: 0.45
      - entity: sensor.plug_nas_power
        name: Power
        color: '#FFCE56'
        type: line
        extend_to: now
        opacity: 1
        show:
          in_header: true
          legend_value: true

  ###########################################################################
  # UPS
  ###########################################################################
  - type: custom:collapsable-cards
    title: UPS
    cards:
      - type: grid
        square: false
        columns: 2
        cards:
          - type: custom:mushroom-template-card
            entity: binary_sensor.tower_ups_connected
            primary: UPS connection
            secondary: >-
              {% set s = states('binary_sensor.tower_ups_connected') %}
              {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
                Unavailable
              {% elif s == 'on' %}
                Connected · {{ state_attr('binary_sensor.tower_ups_connected', 'status') }}
              {% else %}
                Disconnected
              {% endif %}
            icon: mdi:battery-charging
            icon_color: >-
              {% set s = states('binary_sensor.tower_ups_connected') %}
              {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
                disabled
              {% elif s == 'on' %}
                green
              {% else %}
                red
              {% endif %}
            fill_container: true

          - type: custom:mushroom-template-card
            entity: sensor.tower_ups_battery
            primary: Battery
            secondary: >-
              {% set s = states('sensor.tower_ups_battery') %}
              {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
                Unavailable
              {% else %}
                {{ s }}% · {{ state_attr('sensor.tower_ups_battery', 'health') }}
              {% endif %}
            icon: mdi:battery-high
            icon_color: >-
              {% set s = states('sensor.tower_ups_battery') %}
              {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
                disabled
              {% elif s | int(0) <= 25 %}
                red
              {% elif s | int(0) <= 50 %}
                amber
              {% else %}
                green
              {% endif %}
            fill_container: true

          - type: custom:mushroom-template-card
            entity: sensor.tower_ups_load
            primary: Load
            secondary: >-
              {% set s = states('sensor.tower_ups_load') %}
              {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
                Unavailable
              {% else %}
                {{ s }}%
              {% endif %}
            icon: mdi:gauge
            icon_color: >-
              {% set s = states('sensor.tower_ups_load') %}
              {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
                disabled
              {% elif s | float(0) >= 80 %}
                red
              {% elif s | float(0) >= 50 %}
                amber
              {% else %}
                green
              {% endif %}
            fill_container: true

          - type: custom:mushroom-template-card
            entity: sensor.tower_ups_power
            primary: Output power
            secondary: >-
              {% if states('sensor.tower_ups_power') in ['unknown', 'unavailable', 'none', 'None', ''] %}
                Unavailable
              {% else %}
                {{ states('sensor.tower_ups_power') }} W
              {% endif %}
            icon: mdi:flash
            icon_color: >-
              {% if states('sensor.tower_ups_power') in ['unknown', 'unavailable', 'none', 'None', ''] %}
                disabled
              {% else %}
                blue
              {% endif %}
            fill_container: true

          - type: custom:mushroom-template-card
            entity: sensor.tower_ups_runtime
            primary: Runtime
            secondary: >-
              {% set s = states('sensor.tower_ups_runtime') %}
              {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
                Unavailable
              {% else %}
                {{ s }}
              {% endif %}
            icon: mdi:timer-outline
            icon_color: >-
              {% if states('sensor.tower_ups_runtime') in ['unknown', 'unavailable', 'none', 'None', ''] %}
                disabled
              {% else %}
                blue
              {% endif %}
            fill_container: true

          - type: custom:mushroom-template-card
            entity: sensor.tower_ups_ut850eg_battery_health
            primary: Battery health
            secondary: >-
              {% set s = states('sensor.tower_ups_ut850eg_battery_health') %}
              {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
                Unavailable
              {% else %}
                {{ s }}
              {% endif %}
            icon: mdi:heart-pulse
            icon_color: >-
              {% set s = states('sensor.tower_ups_ut850eg_battery_health') %}
              {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
                disabled
              {% elif s | lower == 'good' %}
                green
              {% else %}
                red
              {% endif %}
            fill_container: true

          - type: custom:mushroom-template-card
            entity: sensor.tower_ups_ut850eg_input_voltage
            primary: Input voltage
            secondary: >-
              {% set s = states('sensor.tower_ups_ut850eg_input_voltage') %}
              {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
                Unavailable
              {% else %}
                {{ s }} V
              {% endif %}
            icon: mdi:transmission-tower
            icon_color: >-
              {% if states('sensor.tower_ups_ut850eg_input_voltage') in ['unknown', 'unavailable', 'none', 'None', ''] %}
                disabled
              {% else %}
                blue
              {% endif %}
            fill_container: true

          - type: custom:mushroom-template-card
            entity: sensor.tower_ups_ut850eg_output_voltage
            primary: Output voltage
            secondary: >-
              {% set s = states('sensor.tower_ups_ut850eg_output_voltage') %}
              {% if s in ['unknown', 'unavailable', 'none', 'None', ''] %}
                Unavailable
              {% else %}
                {{ s }} V
              {% endif %}
            icon: mdi:power-plug
            icon_color: >-
              {% if states('sensor.tower_ups_ut850eg_output_voltage') in ['unknown', 'unavailable', 'none', 'None', ''] %}
                disabled
              {% else %}
                blue
              {% endif %}
            fill_container: true

  ###########################################################################
  # REMOTE BACKUP / VPN / PIKVM
  ###########################################################################
  - type: custom:collapsable-cards
    title: Remote backup server
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-template-card
            entity: binary_sensor.rpi4_omv_reachable
            primary: Remote backup server
            secondary: >-
              {% if is_state('binary_sensor.rpi4_omv_reachable', 'on') %}
                Online · {{ states('sensor.rpi4_omv_cpu_temperature') }} °C ·
                Load {{ states('sensor.rpi4_omv_load_1_minute') }}
              {% else %}
                Offline
              {% endif %}
            icon: mdi:nas
            icon_color: >-
              {% if is_state('binary_sensor.rpi4_omv_reachable', 'on') %}
                green
              {% else %}
                red
              {% endif %}
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: Remote backup server details
                  content:
                    type: entities
                    show_header_toggle: false
                    entities:
                      - type: section
                        label: Connectivity
                      - entity: binary_sensor.rpi4_omv
                        name: Ping reachable
                        icon: mdi:server-network
                      - entity: binary_sensor.rpi4_omv_reachable
                        name: System details reachable
                      - entity: sensor.rpi4_omv_round_trip_time_average
                        name: Average RTT
                        icon: mdi:speedometer

                      - type: section
                        label: System
                      - entity: sensor.rpi4_omv_cpu_usage
                        name: CPU usage
                      - entity: sensor.rpi4_omv_cpu_temperature
                        name: CPU temperature
                      - entity: sensor.rpi4_omv_load_1_minute
                        name: Load average
                      - entity: sensor.rpi4_omv_memory_usage
                        name: Memory usage
                      - entity: sensor.rpi4_omv_memory_available
                        name: Memory available
                      - entity: sensor.rpi4_omv_uptime
                        name: Uptime

                      - type: section
                        label: Storage
                      - entity: binary_sensor.rpi4_omv_disk_1_available
                        name: Disk 1 available
                      - entity: binary_sensor.rpi4_omv_disk_1_read_write
                        name: Disk 1 read/write
                      - entity: sensor.rpi4_omv_disk_1_usage
                        name: Disk 1 usage
                      - entity: sensor.rpi4_omv_disk_1_free
                        name: Disk 1 free
                      - entity: binary_sensor.rpi4_omv_disk_2_available
                        name: Disk 2 available
                      - entity: binary_sensor.rpi4_omv_disk_2_read_write
                        name: Disk 2 read/write
                      - entity: sensor.rpi4_omv_disk_2_usage
                        name: Disk 2 usage
                      - entity: sensor.rpi4_omv_disk_2_free
                        name: Disk 2 free
                      - entity: binary_sensor.rpi4_omv_root_filesystem_read_write
                        name: Root filesystem read/write
                      - entity: sensor.rpi4_omv_root_usage
                        name: Root filesystem usage

                      - type: section
                        label: OMV and SMB
                      - entity: binary_sensor.rpi4_omv_service_active
                        name: OMV service
                      - entity: binary_sensor.rpi4_omv_smb_active
                        name: SMB service
                      - entity: binary_sensor.rpi4_omv_smb_port_445_listening
                        name: SMB port 445
                      - entity: binary_sensor.rpi4_omv_external_backups_share_available
                        name: External Backups share
                      - entity: binary_sensor.rpi4_omv_photos_share_available
                        name: Photos share
                      - entity: binary_sensor.rpi4_omv_backups_share_available
                        name: Backups share

                      - type: section
                        label: Diagnostics
                      - entity: sensor.rpi4_omv_failed_systemd_units
                        name: Failed systemd units
                      - entity: sensor.rpi4_omv_recent_storage_errors
                        name: Recent storage errors
            hold_action:
              action: more-info
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.rpi4_omv_cpu_temperature
                primary: CPU Temperature
                secondary: >-
                  {% set value = states('sensor.rpi4_omv_cpu_temperature') %}
                  {% if value in ['unknown', 'unavailable'] %}
                    Unavailable
                  {% else %}
                    {{ value }} °C
                  {% endif %}
                icon: mdi:thermometer
                icon_color: >-
                  {% set value = states('sensor.rpi4_omv_cpu_temperature') | float(0) %}
                  {% if value >= 75 %}
                    red
                  {% elif value >= 60 %}
                    orange
                  {% else %}
                    green
                  {% endif %}
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.rpi4_omv_load_1_minute
                primary: System Load
                secondary: >-
                  {% set value = states('sensor.rpi4_omv_load_1_minute') %}
                  {% if value in ['unknown', 'unavailable'] %}
                    Unavailable
                  {% else %}
                    {{ value }}
                  {% endif %}
                icon: mdi:chart-line
                icon_color: >-
                  {% set value = states('sensor.rpi4_omv_load_1_minute') | float(0) %}
                  {% if value >= 3 %}
                    red
                  {% elif value >= 2 %}
                    orange
                  {% else %}
                    blue
                  {% endif %}
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: binary_sensor.rpi4_omv_smb_active
                primary: SMB Service
                secondary: >-
                  {% if is_state('binary_sensor.rpi4_omv_smb_active', 'on') %}
                    Active
                  {% else %}
                    Inactive
                  {% endif %}
                icon: mdi:folder-network
                icon_color: >-
                  {% if is_state('binary_sensor.rpi4_omv_smb_active', 'on') %}
                    green
                  {% else %}
                    red
                  {% endif %}
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.rpi4_omv_round_trip_time_average
                primary: Average RTT
                secondary: >-
                  {% set value = states('sensor.rpi4_omv_round_trip_time_average') %}
                  {% if value in ['unknown', 'unavailable'] %}
                    Unavailable
                  {% else %}
                    {{ value }} ms
                  {% endif %}
                icon: mdi:speedometer
                icon_color: >-
                  {% set value = states('sensor.rpi4_omv_round_trip_time_average') | float(0) %}
                  {% if value >= 100 %}
                    red
                  {% elif value >= 50 %}
                    orange
                  {% else %}
                    cyan
                  {% endif %}
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: binary_sensor.rpi4_omv_disk_1_available
                primary: Disk 1
                secondary: >-
                  {% if is_state('binary_sensor.rpi4_omv_disk_1_available', 'off') %}
                    Unavailable
                  {% else %}
                    {{ states('sensor.rpi4_omv_disk_1_usage') }}% used
                  {% endif %}
                icon: mdi:harddisk
                icon_color: >-
                  {% if is_state('binary_sensor.rpi4_omv_disk_1_available', 'off') %}
                    red
                  {% else %}
                    {% set value = states('sensor.rpi4_omv_disk_1_usage') | float(0) %}
                    {% if value >= 90 %}
                      red
                    {% elif value >= 80 %}
                      orange
                    {% else %}
                      green
                    {% endif %}
                  {% endif %}
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: binary_sensor.rpi4_omv_disk_2_available
                primary: Disk 2
                secondary: >-
                  {% if is_state('binary_sensor.rpi4_omv_disk_2_available', 'off') %}
                    Unavailable
                  {% else %}
                    {{ states('sensor.rpi4_omv_disk_2_usage') }}% used
                  {% endif %}
                icon: mdi:harddisk
                icon_color: >-
                  {% if is_state('binary_sensor.rpi4_omv_disk_2_available', 'off') %}
                    red
                  {% else %}
                    {% set value = states('sensor.rpi4_omv_disk_2_usage') | float(0) %}
                    {% if value >= 90 %}
                      red
                    {% elif value >= 80 %}
                      orange
                    {% else %}
                      green
                    {% endif %}
                  {% endif %}
                tap_action:
                  action: more-info

  - type: custom:collapsable-cards
    title: AirVPN
    cards:
      - type: grid
