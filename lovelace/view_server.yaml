            color: '#1E88E5'
          - entity: sensor.airvpn_upload_speed
            name: Upload
            color: '#43A047'

  - type: custom:collapsable-cards
    title: PiKVM NAS
    cards:
      - type: grid
        square: false
        columns: 2
        cards:
          - type: custom:mushroom-template-card
            entity: binary_sensor.pikvm_nas
            primary: PiKVM NAS
            secondary: >-
              {%- if is_state('binary_sensor.pikvm_nas', 'on') -%}
                Reachable
              {%- elif is_state('binary_sensor.pikvm_nas', 'off') -%}
                Unreachable
