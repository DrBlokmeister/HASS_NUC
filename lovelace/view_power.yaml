  - type: custom:collapsable-cards
    title: Device Power Switches
    cards:
      - type: entities
        #title: Power Switches
        show_header_toggle: false
        entities:
          - entity: switch.plug_10gb_switch
            name: 10Gb Switch
            icon: mdi:switch
            confirm:
              text: "Are you sure you want to turn off the 10Gb Switch?"
          - entity: switch.plug_3d_printer_switch
            name: 3D Printer
            icon: mdi:printer-3d
          - entity: switch.plug_dishwasher_switch
            name: Dishwasher
            icon: mdi:dishwasher
          - entity: switch.plug_electric_car_switch
            name: Electric Car
            icon: mdi:car-electric
          - entity: switch.plug_epaper_ap_switch
            name: ePaper Access Point
            icon: mdi:access-point-network
          - entity: switch.plug_nas_switch
            name: NAS
            icon: mdi:nas
            confirm:
              text: "Are you sure you want to turn off the NAS?"
          - entity: switch.plug_nuc_switch
            name: NUC
            icon: mdi:desktop-classic
            confirm:
              text: "Are you sure you want to turn off the NUC?"
          - entity: switch.plug_poe_switch_switch
            name: PoE Switch
            icon: mdi:switch
            confirm:
              text: "Are you sure you want to turn off the PoE Switch?"
          - entity: switch.plug_router_switch
            name: Router
            icon: mdi:router-wireless
            confirm:
              text: "Are you sure you want to turn off the Router?"
          - entity: switch.desk_plug_study_desk_switch
            name: Study Desk
            icon: mdi:desk
            confirm:
              text: "Are you sure you want to turn off the desk power?"
          - entity: switch.plug_study_workbench_switch
            name: Study Workbench
            icon: mdi:desk-lamp
          - entity: switch.plug_tv_switch
            name: TV
            icon: mdi:television
          - entity: switch.plug_washing_machine_switch
            name: Washing Machine
            icon: mdi:washing-machine
          - entity: switch.plug_watercooker_switch
            name: Water Cooker
            icon: mdi:kettle
          - entity: switch.plug_oven_switch
            name: Oven
            icon: mdi:stove
  - type: vertical-stack
    cards:
      # Electricity Usage Charts
      - type: custom:apexcharts-card
        header:
          show: true
          title: Daily Electricity Usage
          show_states: true
          colorize_states: true
        update_interval: 5min
        graph_span: 14d
        apex_config:
          chart:
            height: 200px
          legend:
            show: false
          grid:
            padding:
              left: 0
              right: 0
              bottom: -10
              top: -50
        yaxis:
          - min: 0
            max: ~25
            align_to: 5
            apex_config:
              #stepSize: 5
              tickAmount: 4
              forceNiceScale: true
              labels:
                offsetX: -15
                rotate: 0
        experimental:
          color_threshold: true
        all_series_config:
          float_precision: 2
          show:
            datalabels: false
          statistics:
            type: state
            period: day
            align: middle
          type: column
          color_threshold:
            - value: 3
              color: '#66BB6A'
            - value: 6
              color: '#8BC34A'
            - value: 9
              color: '#D4E157'
            - value: 12
              color: '#FFEB3B'
            - value: 15
              color: '#FFC107'
            - value: 18
              color: '#FF9800'
            - value: 21
              color: '#FF7043'
            - value: 24
              color: '#F4511E'
            - value: 27
              color: '#E53935'
            - value: 30
              color: '#B71C1C'
        series:
          - entity: sensor.daily_energy_use
            name: Daily Energy Usage
            #color: '#42d7d7'
      - type: custom:apexcharts-card
        header:
          show: true
          title: Monthly Electricity Usage
          show_states: true
          colorize_states: true
        update_interval: 5min
        graph_span: 365d
        apex_config:
          chart:
            height: 200px
          legend:
            show: false
          grid:
            padding:
              left: 0
              right: 0
              bottom: -10
              top: -50
        yaxis:
          - min: 0
            max: ~600
            align_to: 100
            apex_config:
              #stepSize: 5
              tickAmount: 4
              forceNiceScale: true
              labels:
                offsetX: -15
                rotate: 0
        experimental:
          color_threshold: true
        all_series_config:
          float_precision: 2
          show:
            datalabels: false
          statistics:
            type: state
            period: month
            align: middle
          type: column
          color_threshold:
            - value: 70
              color: '#66BB6A'
            - value: 140
              color: '#8BC34A'
            - value: 210
              color: '#D4E157'
            - value: 280
              color: '#FFEB3B'
            - value: 350
              color: '#FFC107'
            - value: 420
              color: '#FF9800'
            - value: 490
              color: '#FF7043'
            - value: 560
              color: '#F4511E'
            - value: 630
              color: '#E53935'
            - value: 700
              color: '#B71C1C'
