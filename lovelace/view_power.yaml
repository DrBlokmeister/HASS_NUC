##########################################  HERE BEGINS THE POWER TAB  ##########################################

###### Device Colors #####
# Electric Car: '#FFC107'
# Computer: '#4CAF50'
# NAS: '#8BC34A'
# Tapwater: '#FF9800'
# Heating: '#FF5722'
# Washing Machine: '#9C27B0'
# PoE: '#2196F3'
# Ventilation: '#FF9800'
# Dishwasher: '#673AB7'
# Watercooker: '#9C27B0'
# NUC: '#66BB6A'
# 10GBe Switch: '#1976D2'
# Router: '#03A9F4'
# Ambilight/Amplifier: '#FFB300'
# TV: '#FFCA28'
# Circulation: '#795548'
# 3D Printer: '#FFA726'
# Lights: '#FFEB3B'
# Vacuums: '#9E9E9E'
# Unknown: '#BDBDBD'

title: Power
icon: mdi:lightning-bolt
badges: []
cards:
  - type: vertical-stack
    cards:
      - type: gauge
        name: Net Power usage
        unit: 'kW'
        entity: sensor.net_power_usage
        min: -3
        max: 3
        needle: true
        segments:
          - from: -3
            to: -2.5
            color: '#2636FF'  # Deep Blue
          - from: -2.5
            to: -2
            color: '#3042FF'  # Dark Blue
          - from: -2
            to: -1.5
            color: '#3A5EFF'  # Royal Blue
          - from: -1.5
            to: -1
            color: '#447AFF'  # Bright Blue
          - from: -1
            to: -0.5
            color: '#4E96FF'  # Sky Blue
          - from: -0.5
            to: 0
            color: '#58B3FF'  # Soft Blue
          - from: 0
            to: 0.75
            color: '#8BC34A'  # Green
          - from: 0.75
            to: 1.5
            color: '#FFEB3B'  # Yellow
          - from: 1.5
            to: 2.25
            color: '#FFC107'  # Amber
          - from: 2.25
            to: 3
            color: '#E64A19'  # Deep Orange
      - type: horizontal-stack
        cards:
          - type: gauge
            name: Total Power usage
            unit: 'W'
            entity: sensor.total_power_consumption_watt
            min: 0
            max: 5000
            segments:
              - from: 0
                to: 2500
                color: '#8BC34A'  # Soft Green
              - from: 2500
                to: 3500
                color: '#FFEB3B'  # Soft Yellow
              - from: 3500
                to: 5000
                color: '#F44336'  # Soft Red
          - type: gauge
            name: Total Power Production
            unit: 'W'
            entity: sensor.solar_panel_power_production_available
            min: 0
            max: 3000
            segments:
              - from: 0
                to: 500
                color: "#4CAF50"  # Green
              - from: 500
                to: 1000
                color: "#00BCD4"  # Green
              - from: 1000
                to: 1500
                color: "#2196F3"  # Green
              - from: 1500
                to: 2000
                color: "#3F51B5"  # Green
              - from: 2000
                to: 2500
                color: "#303F9F"  # Green
              - from: 2500
                to: 3000
                color: "#1A237E"  # Green
      - type: custom:decluttering-card
        template: energy_bar_graph_card
        variables:
          - name: Net Energy Usage
          - entity: sensor.net_energy_use_daily
          - graph_span_offset: -13d
          - graph_span: 14d
          - lower_bound: ~-10
          - upper_bound: ~20
          - unit: kWh
          - float_precision: 1
          - yaxis_float_precision: 0
          - graph_color_thresholds:
              # Negative usage / net production
              - value: -10
                color: "#0A174E"  # Very deep blue
              - value: -5
                color: "#123E8A"  # Deep blue
              - value: -3.5
                color: "#1769AA"  # Blue
              - value: -2
                color: "#168FBA"  # Cyan blue
              - value: -1
                color: "#08AFAE"  # Blue-green

              # Neutral point and common positive range
              - value: 0
                color: "#00BFA5"  # Green
              - value: 0.75
                color: "#42D645"  # Bright green
              - value: 1.5
                color: "#A6CE28"  # Yellow-green
              - value: 2.5
                color: "#F5D523"  # Yellow
              - value: 3.5
                color: "#FFC41F"  # Amber
              - value: 5
                color: "#FF8618"  # Orange

              # Less common high-consumption range
              - value: 7
                color: "#FF5F1F"  # Red-orange
              - value: 10
                color: "#E83A24"  # Red
              - value: 14
                color: "#B71F20"  # Dark red
              - value: 17
                color: "#641416"  # Red-brown
              - value: 19
                color: "#32100E"  # Dark brown
              - value: 20
                color: "#111111"  # Nearly black

      - type: custom:decluttering-card
        template: energy_bar_graph_card
        variables:
          - name: Total Electricity Usage
          - entity: sensor.daily_energy_use
          - graph_span_offset: -13d
          - graph_span: 14d
          - lower_bound: 0
          - upper_bound: ~20
          - unit: kWh
          - float_precision: 1
          - yaxis_float_precision: 0
          - graph_color_thresholds:
              - value: 0
                color: "#00BFA5"
              - value: 1.46
                color: "#00C990"
              - value: 2.92
                color: "#00D47A"
              - value: 4.38
                color: "#16D860"
              - value: 5.83
                color: "#42D645"
              - value: 7.29
                color: "#72D230"
              - value: 8.75
                color: "#A6CE28"
              - value: 10.21
                color: "#D3CE24"
              - value: 11.67
                color: "#F5D523"
              - value: 13.13
                color: "#FFC41F"
              - value: 14.58
                color: "#FFA91A"
              - value: 16.04
                color: "#FF8618"
              - value: 17.5
                color: "#FF5F1F"
              - value: 21.88
                color: "#E83A24"
              - value: 26.25
                color: "#B71F20"
              - value: 30.63
                color: "#641416"
              - value: 35
                color: "#111111"

      - type: custom:decluttering-card
        template: energy_bar_graph_card
        variables:
          - name: Solar Production
          - entity: sensor.solar_panel_daily_energy_production
          - graph_span_offset: -13d
          - graph_span: 14d
          - lower_bound: 0
          - upper_bound: ~23
          - unit: kWh
          - float_precision: 1
          - yaxis_float_precision: 0
          - graph_color_thresholds:
              - value: 0
                color: "#E64A19"  # Very low production
              - value: 1.5
                color: "#F57C00"
              - value: 3
                color: "#FF9800"
              - value: 4.5
                color: "#FFB300"
              - value: 6
                color: "#FBC02D"
              - value: 7.5
                color: "#CDDC39"
              - value: 9
                color: "#8BC34A"
              - value: 10.5
                color: "#4CAF50"
              - value: 12
                color: "#00BFA5"
              - value: 13.5
                color: "#00BCD4"
              - value: 15
                color: "#03A9F4"
              - value: 16.5
                color: "#2196F3"
              - value: 18
                color: "#3F51B5"
              - value: 19.5
                color: "#3949AB"
              - value: 21
                color: "#303F9F"
              - value: 22
                color: "#283593"
              - value: 23
                color: "#1A237E"  # Excellent production

      - type: custom:decluttering-card
        template: energy_bar_graph_card
        variables:
          - name: Water Usage
          - entity: sensor.daily_water_use
          - graph_span_offset: -13d
          - graph_span: 14d
          - lower_bound: 0
          - upper_bound: 800
          - unit: L
          - float_precision: 0
          - yaxis_float_precision: 0
          - graph_color_thresholds:
              - value: 0
                color: "#2196F3"
              - value: 50
                color: "#00BCD4"
              - value: 100
                color: "#00BFA5"
              - value: 150
                color: "#4CAF50"
              - value: 200
                color: "#8BC34A"
              - value: 250
                color: "#CDDC39"
              - value: 300
                color: "#FFEB3B"
              - value: 350
                color: "#FFD54F"
              - value: 400
                color: "#FFC107"
              - value: 450
                color: "#FFB300"
              - value: 500
                color: "#FF9800"
              - value: 550
                color: "#F57C00"
              - value: 600
                color: "#F44336"
              - value: 650
                color: "#D32F2F"
              - value: 700
                color: "#B71C1C"
              - value: 750
                color: "#701010"
              - value: 800
                color: "#321010"
  - type: vertical-stack
    cards:
    - type: custom:apexcharts-card
      header:
        title: Energy Usage Today
        show: true
        show_states: true
        colorize_states: true
      graph_span: 1m
      update_interval: 1m
      yaxis:
        - min: 0
          max: ~0.4
          decimals: 2
          apex_config:
            tickAmount: 4
            forceNiceScale: true
      apex_config:
        chart:
          height: 500px
        legend:
          show: false
          floating: false
          position: bottom
          horizontalAlign: left
        plotOptions:
          pie:
            donut:
              labels:
                show: true
                total:
                  show: true
                  label: Total
                  formatter: |
                    EVAL:function(w) {
                      return (w.globals.seriesTotals.reduce((a, b) => {return (a + b)} , 0)).toFixed(2) + ' kWh';
                    }
                value:
                  show: true
                  formatter: |
                    EVAL:function(val) { return Number(val).toFixed(2) + ' kWh'; }
      all_series_config:
        group_by:
          func: last
          duration: 1min
        float_precision: 2
        show:
          datalabels: false
      chart_type: donut
      series:
        - entity: sensor.plug_air_conditioner_energy_today
          name: Air Conditioner
          color: '#00ACC1'
        - entity: sensor.plug_electric_bike_energy_today
          name: Electric Bike
          color: '#9CCC65'
        - entity: sensor.plug_electric_car_energy_today
          name: Electric Car
          color: '#FFC107'
        - entity: sensor.plug_study_desk_energy_today
          name: Computer
          color: '#4CAF50'  # Green but softer
        - entity: sensor.plug_nas_energy_today
          name: NAS
          color: '#8BC34A'
        - entity: sensor.heatpump_tapwater_daily_energy_use
          name: Tapwater
          color: '#FF9800'
        - entity: sensor.heatpump_verwarming_daily_energy_use
          name: Heating
          color: '#FF5722'
        - entity: sensor.plug_washing_machine_energy_today
          name: Washing Machine
          color: '#9C27B0'
        - entity: sensor.plug_poe_switch_energy_today
          name: PoE
          color: '#2196F3'
        - entity: sensor.ventilation_daily_energy_use
          name: Ventilation
          color: '#FF9800'
        - entity: sensor.plug_dishwasher_energy_today
          name: Dishwasher
          color: '#673AB7'
        - entity: sensor.plug_watercooker_energy_today
          name: Watercooker
          color: '#1E90FF'
        - entity: sensor.plug_nuc_energy_today
          name: NUC
          color: '#66BB6A'
        - entity: sensor.plug_10gb_switch_energy_today
          name: 10Gb Switch
          color: '#1976D2'
        - entity: sensor.plug_router_energy_today
          name: Router
          color: '#03A9F4'
        - entity: sensor.blitzwolf_ambilight_amplifier_daily_energy
          name: Ambilight Amplifier
          color: '#FFB300'
        - entity: sensor.plug_tv_energy_today
          name: TV
          color: '#FFCA28'
        - entity: sensor.heatpump_circulation_daily_energy_use
          name: Circulation
          color: '#795548'
        - entity: sensor.plug_3d_printer_energy_today
          name: 3D Printer
          color: '#FFA726'
        - entity: sensor.all_lights_power_estimate_energy_daily
          name: Lights
          color: '#FFEB3B'
        - entity: sensor.vacuums_daily_energy_use
          name: Vacuums
          color: '#9E9E9E'
        - entity: sensor.plug_oven_energy_today
          name: Oven
          color: '#E64A19'
        - entity: sensor.daily_unknown_energy
          name: Unknown
          color: '#BDBDBD'
    - type: custom:apexcharts-card
      header:
        title: Current Power Usage
        show: true
        show_states: true
        colorize_states: true
      graph_span: 1m
      update_interval: 1m
      all_series_config:
        group_by:
          func: avg
          duration: 1min
        float_precision: 0
        show:
          datalabels: false
      apex_config:
        legend:
          show: false
        plotOptions:
          pie:
            donut:
              labels:
                show: true
                total:
                  show: true
                  label: Total
                  formatter: |
                    EVAL:function(w) {
                      return Math.round(w.globals.seriesTotals.reduce((a, b) => a + b , 0)) + ' W';
                    }
                value:
                  show: true
                  formatter: |
                    EVAL:function(val) {
                      return Math.round(val) + ' W';
                    }
      yaxis:
        - decimals: 0
      chart_type: donut
      series:
        - entity: sensor.plug_air_conditioner_power
          name: Air Conditioner
          color: '#00ACC1'
        - entity: sensor.plug_electric_bike_power
          name: Electric Bike
          color: '#9CCC65'
        - entity: sensor.plug_electric_car_power
          name: Electric Car
          color: '#FFC107'
        - entity: sensor.plug_study_desk_power
          name: Computer
          color: '#4CAF50'  # Computing Devices - Green
        - entity: sensor.plug_nas_power
          name: NAS
          color: '#8BC34A'
        - entity: sensor.heatpump_tapwater_power
          name: Tapwater
          color: '#FF9800'
        - entity: sensor.heatpump_heating_power
          name: Heating
          color: '#FF5722'
        - entity: sensor.plug_washing_machine_power
          name: Washing Machine
          color: '#9C27B0'
        - entity: sensor.plug_poe_switch_power
          name: PoE
          color: '#2196F3'
        - entity: sensor.ventilation_power_estimate
          name: Ventilation
          color: '#FF9800'
        - entity: sensor.plug_dishwasher_power
          name: Dishwasher
          color: '#673AB7'
        - entity: sensor.plug_study_workbench_power
          name: Study Workbench
          color: '#66BB6A'
        - entity: sensor.plug_watercooker_power
          name: Watercooker
          color: '#1E90FF'
        - entity: sensor.plug_nuc_power
          name: NUC
          color: '#66BB6A'
        - entity: sensor.plug_10gb_switch_power
          name: 10Gb Switch
          color: '#1976D2'
        - entity: sensor.plug_router_power
          name: Router
          color: '#03A9F4'
        - entity: sensor.blitzwolf_ambilight_amplifier_power
          name: Ambilight Amplifier
          color: '#FFB300'
        - entity: sensor.plug_tv_power
          name: TV
          color: '#FFCA28'
        - entity: sensor.plug_heat_pump_power
          name: Circulation
          color: '#795548'
        - entity: sensor.plug_3d_printer_power
          name: 3D Printer
          color: '#FFA726'
        - entity: sensor.all_lights_power_estimate_power
          name: Lights
          color: '#FFEB3B'
        - entity: sensor.vacuums_power_estimate
          name: Vacuums
          color: '#9E9E9E'
        - entity: sensor.shellies_background_power_estimate
          name: Shellies
          color: '#00796B'
        - entity: sensor.plug_oven_power
          name: Oven
          color: '#E64A19'
        - entity: sensor.averaged_unknown_power
          name: Unknown
          color: '#BDBDBD'
    - type: custom:collapsable-cards
      title: Power Phases
      cards:
        - type: custom:apexcharts-card
          header:
            title: Power Phases
            show: true
            show_states: true
            colorize_states: true
          graph_span: 1m
          update_interval: 1m
          all_series_config:
            group_by:
              func: avg
              duration: 1min
            float_precision: 0
          apex_config:
            legend:
              show: false
            plotOptions:
              pie:
                donut:
                  labels:
                    show: true
                    total:
                      show: true
                      label: Total
                      formatter: |
                        EVAL:function(w) {
                          return Math.round((w.globals.seriesTotals.reduce((a, b) => {return (a + b)} , 0)).toFixed(2)) + ' W';
                          }
                    value:
                      show: true
                      formatter: |
                        EVAL:function(val) {
                          return Math.round(val) + ' W'
                        }
          chart_type: donut
          series:
            - entity: sensor.electricity_meter_power_consumption_phase_l1
              name: Phase 1
              transform: "return (x * 1000);"
              unit: W
            - entity: sensor.electricity_meter_power_consumption_phase_l2
              name: Phase 2
              transform: "return (x * 1000);"
              unit: W
            - entity: sensor.electricity_meter_power_consumption_phase_l3
              name: Phase 3
              transform: "return (x * 1000);"
              unit: W
        - type: custom:apexcharts-card
          header:
            title: Power Phases
            show: true
            show_states: true
            colorize_states: true
          graph_span: 24h
          update_interval: 1m
          stacked: true
          yaxis:
            - min: 0
              max: ~4000
              decimals: 0
              apex_config:
                tickAmount: 4
          all_series_config:
            stroke_width: 2
            float_precision: 0
            transform: "return Math.round(x * 1000);"
            unit: W
            show:
              datalabels: false
            group_by:
              func: avg
              duration: 5min
          chart_type: line
          brush:
            selection_span: 10m
          apex_config:
            legend:
              show: false
          series:
            - entity: sensor.electricity_meter_power_consumption_phase_l1
              name: Phase 1
            - entity: sensor.electricity_meter_power_consumption_phase_l2
              name: Phase 2
            - entity: sensor.electricity_meter_power_consumption_phase_l3
              name: Phase 3
            - entity: sensor.total_power_consumption_watt
              name: Total
              transform: "return Math.round(x * 1);"
              show:
                in_brush: true
                in_chart: false

    - type: custom:mini-graph-card
      entities:
        - color: grey
          entity: sensor.total_power_consumption_watt
          name: Total
          show_legend: true
          #show_line: false
          show_points: false
          smoothing: false
          value_factor: 1000 #Convert kW of sensor to W
        - entity: sensor.plug_study_desk_power
          name: Computer
          color: '#4CAF50'  # Computing Devices - Green
        - entity: sensor.plug_nas_power
          name: NAS
          color: '#8BC34A'  # Computing Devices - Light green
        - entity: sensor.plug_nuc_power
          name: NUC
          color: '#66BB6A'  # Computing Devices - Medium sea green
        - entity: sensor.plug_10gb_switch_power
          name: 10GBe Switch
          color: '#1976D2'  # Network Devices - Darker blue
        - entity: sensor.plug_router_power
          name: Router
          color: '#03A9F4'  # Network Devices - Lighter blue
        - entity: sensor.plug_electric_car_power
          name: Electric Car
          color: '#FFC107'  # Entertainment and Others - Amber
        - entity: sensor.blitzwolf_ambilight_amplifier_power
          name: Ambilight Amplifier
          color: '#FFB300'  # Entertainment and Others - Vivid but not harsh amber
        - entity: sensor.plug_3d_printer_power
          name: 3D Printer
          color: '#FFA726'  # Entertainment and Others - Orange peel, slightly playful
        - entity: sensor.heatpump_heating_power
          name: Heating
          color: '#FF5722'  # Central House Systems - Deep orange
        - entity: sensor.heatpump_tapwater_power
          name: Tapwater
          color: '#FF9800'  # Central House Systems - A muted orange
        - entity: sensor.ventilation_power_estimate
          name: Ventilation
          color: '#FF9800'  # Central House Systems - Earthy orange
        - entity: sensor.plug_heat_pump_power
          name: Circulation
          color: '#795548'  # Central House Systems - Brown
        - entity: sensor.plug_washing_machine_power
          name: Washing Machine
          color: '#9C27B0'  # Home Appliances - A deeper purple
        - entity: sensor.plug_dishwasher_power
          name: Dishwasher
          color: '#673AB7'  # Home Appliances - Darker orchid
        - entity: sensor.all_lights_power_estimate_power
          name: Lights
          color: '#FFEB3B'  # Entertainment and Others - Bright yellow
        - entity: sensor.vacuums_power_estimate
          name: Vacuums
          color: '#9E9E9E'  # Central House Systems - Grey
        - entity: sensor.plug_oven_power
          name: Oven
          color: '#FF5722'  # Deep orange, for warmth and cooking
        - entity: sensor.averaged_unknown_power
          name: Unknown
          color: '#BDBDBD'  # Unknown category - Light grey
      icon: mdi:lightning-bolt
      name: Power
      hours_to_show: 24
      hour24: true
      font_size: 70
      line_width: 2.5
      points_per_hour: 30
      height: 300
      lower_bound: 0
      upper_bound: 2000
      show:
        labels: true
        average: false
    - type: custom:decluttering-card
      template: energy_price_apexchart_15min
      variables:
        - day: today
    - type: conditional
      conditions:
        - condition: state
          entity: binary_sensor.tomorrow_s_electricity_prices_available
          state: "on"
      card:
        type: custom:decluttering-card
        template: energy_price_apexchart_15min
        variables:
          - span_offset: +1d
          - day: tomorrow
  - type: grid
    columns: 3
    square: false
    cards:
      - type: custom:decluttering-card
        template: mini_power_graph
        variables:
          - entity: sensor.plug_nas_power
          - name: NAS
          - color: '#d74242'
      - type: custom:decluttering-card
        template: mini_power_graph
        variables:
          - entity: sensor.plug_study_desk_power
          - name: Computer
          - color: '#d7b242'
      - type: custom:decluttering-card
        template: mini_power_graph
        variables:
          - entity: sensor.plug_nuc_power
          - name: NUC
          - color: '#8cd742'
      - type: custom:decluttering-card
        template: mini_power_graph
        variables:
          - entity: sensor.blitzwolf_ambilight_amplifier_power
          - name: Ambilight/Amplifier
          - color: '#42d767'
          - factor: 3
          - unit: W
      - type: custom:decluttering-card
        template: mini_power_graph
        variables:
          - entity: sensor.plug_watercooker_power
          - name: Watercooker
          - color: '#42d7d7'
