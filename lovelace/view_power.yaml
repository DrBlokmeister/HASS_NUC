      - type: custom:decluttering-card
        template: mini_power_graph
        variables:
          - entity: sensor.plug_3d_printer_power
          - name: Ender3
          - color: '#4267d7'

  - type: vertical-stack
    cards:
      - type: custom:collapsable-cards
        title: Individual Device Energy
        cards:
          - type: grid
            square: false
            columns: 2
            cards:
              # BALANCING / UNACCOUNTED ENERGY
              - type: custom:decluttering-card
                template: energy_bar_graph_card
                variables:
                  - name: Unknown
                  - entity: sensor.daily_unknown_energy
                  - upper_bound: ~5
                  - graph_color_thresholds:
                      - value: 0
                        color: "#00BFA5"
                      - value: 0.333
                        color: "#00C990"
                      - value: 0.667
                        color: "#00D47A"
                      - value: 1
                        color: "#16D860"
                      - value: 1.333
                        color: "#42D645"
                      - value: 1.667
                        color: "#72D230"
                      - value: 2
                        color: "#A6CE28"
                      - value: 2.333
                        color: "#D3CE24"
                      - value: 2.667
                        color: "#F5D523"
                      - value: 3
                        color: "#FFC41F"
                      - value: 3.5
                        color: "#FFAA1A"
                      - value: 4
                        color: "#FF8618"
                      - value: 5
                        color: "#FF5F1F"
              # CLIMATE AND HOUSE SERVICES
              - type: custom:decluttering-card
                template: energy_bar_graph_card
                variables:
                  - name: Air Conditioner
