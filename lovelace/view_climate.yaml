##########################################  HERE BEGINS THE CLIMATE TAB  ##########################################
title: Climate
icon: mdi:home-thermometer-outline
cards:
  - type: vertical-stack
    cards:
      - type: entities
        title: "Heat Pump Control"
        show_header_toggle: false
        entities:
          - entity: sensor.heatpump_status
            name: "Status"
          - entity: sensor.shelly_heat_pump_power
            name: Heat Pump Power
            icon: mdi:meter-electric-outline
          - entity: sensor.plug_heat_pump_power
            name: Circulation Pump Power
            icon: mdi:meter-electric-outline
          - type: custom:fold-entity-row
            head:
              type: section
              label: "Price Control Settings"
            items:
              - entity: input_select.heatpump_price_control
                name: "Heating Price Control Mode"
              - entity: input_number.heatpump_fixed_price_threshold
                name: "Heating Fixed Price Threshold"
              - entity: input_number.heatpump_target_correction
                name: "Automation Target Correction"
              - entity: input_select.heatpump_cooling_price_control
                name: "Cooling Price Control Mode"
              - entity: input_number.heatpump_cooling_fixed_price_threshold
                name: "Cooling Fixed Price Threshold"
              - entity: sensor.lowest_quartile_electricity_price_today
                name: "First Quartile Price"
                icon: mdi:cash-multiple
              - entity: sensor.nordpool_energy_price_hourly
                name: "Current Energy Price"
                icon: mdi:cash-multiple
      - type: custom:collapsable-cards
        title: Internal Heatpump Entities
        cards:
          - type: button
            name: Go to Heating Integration Config
            tap_action:
              action: navigate
              navigation_path: "/config/devices/device/d9738fb5b691755714eef946f5e42d56"
          - type: entities
            entities:
              - entity: number.heatpump_heating_target_correction
                name: "Heating Target Correction"
                icon: mdi:thermometer-water
              - entity: sensor.heatpump_flow_in_temperature
                name: "Flow In Temperature"
              - entity: sensor.heatpump_flow_out_temperature
                name: "Flow Out Temperature"
              - entity: sensor.heatpump_flow_out_temperature_target
                name: "Flow Out Target Temperature"
                icon: mdi:thermometer-water
              - entity: sensor.heatpump_heat_source_input_temperature
                name: "Heat Source Input Temperature"
                icon: mdi:waves-arrow-left
              - entity: sensor.heatpump_heat_source_output_temperature
                name: "Heat Source Output Temperature"
                icon: mdi:waves-arrow-right
              - entity: sensor.heatpump_outdoor_temperature
                name: "Outdoor Temperature"
                icon: mdi:thermometer
      - type: custom:collapsable-cards
        title: Tapwater Control Entities
        cards:
          - type: button
            name: Go to Tapwater Integration Config
            tap_action:
              action: navigate
              navigation_path: "/config/devices/device/35a88a4606311aa511616275666750cd"
          - type: entities
            entities:
              - entity: water_heater.heatpump_domestic_water
                name: "Tapwater Heater"
              - entity: sensor.heatpump_tapwater_temperature
                name: "Current Temperature"
              - entity: input_number.tapwater_set_back_temperature
                name: "Automation Set Back Temp"
                icon: mdi:thermometer-water
              - entity: input_number.tapwater_heat_up_temperature
                name: "Automation Heat Up Temp"
                icon: mdi:thermometer-water
              - entity: binary_sensor.heatpump_tapwater_recirculation_pump
                name: "Recirculation Pump"
              - entity: number.heatpump_tapwater_hysteresis
                name: "Internal Hysteresis"
                icon: mdi:thermometer-water
              - entity: number.heatpump_tapwater_target_temperature
                name: "Internal Target"
      - type: custom:apexcharts-card
        header:
          show_states: true
          colorize_states: true
          show: true
          title: "Heat Pump Flow Temperature"
        update_interval: 1min
        apex_config:
          legend:
            show: false
          chart:
            height: 300px
        graph_span: 48h
        yaxis:
          - id: temp
            min: ~10
            max: 30
            decimals: 0
            align_to: 5
            apex_config:
              forceNiceScale: True
          - id: power
            min: 0
            max: ~1000
            decimals: 0
            align_to: 200
            opposite: true
            show: true
          - id: binary
            min: 0
            max: 1
            decimals: 0
            align_to: 1
            show: false
        all_series_config:
          group_by:
            func: avg
            duration: 10min
          stroke_width: 3
          fill_raw: last
        series:
          - entity: sensor.heatpump_flow_out_temperature
            name: "Current Flow Temperature"
            yaxis_id: temp
            type: line
            color: "#1E88E5"  # Royal Blue (clear and distinct)
          - entity: sensor.heatpump_flow_out_temperature_target
            name: "Target Flow Temperature"
            yaxis_id: temp
            type: line
            stroke_dash: 3
            color: "#D32F2F"  # Dashed Warm Red (stands out without overpowering)
          - entity: sensor.heatpump_status
            name: "Heating On"
            yaxis_id: binary
            stroke_width: 0
            type: area
            transform: "return x === 'heating' ? 1 : 0;"
            color: "#FF7043"  # Fiery Orange (better contrast)
            opacity: 0.4
            show:
              legend_value: false
              in_header: false
          - entity: sensor.heatpump_status
            name: "Tapwater On"
            yaxis_id: binary
            stroke_width: 0
            type: area
            transform: "return x === 'hot water' ? 1 : 0;"
            color: "#00897B"  # Teal (better contrast for water)
            opacity: 0.4
            show:
              legend_value: false
              in_header: false
          - entity: sensor.shelly_heat_pump_power
            name: "Power"
            yaxis_id: power
            type: line
            stroke_width: 2
            color: "#FF851B"  # Dashed Warm Red (stands out without overpowering)
      - type: history-graph
        title: Heat Pump Status
        hours_to_show: 48
        entities:
          - entity: sensor.heatpump_status
            name: Status
          - entity: binary_sensor.heatpump_additional_circulation_pump
            name: Pump1
          - entity: binary_sensor.heatpump_dhw_circulation_pump
            name: DHW Pump

  - type: vertical-stack
    cards:
      - type: custom:mushroom-climate-card
        entity: climate.portable_split_air_conditioner
        name: Portable Split Air Conditioner
        icon: mdi:air-conditioner
        hvac_modes:
          - "off"
          - cool
        show_temperature_control: true
        collapsible_controls: false
        fill_container: true
      - type: custom:collapsable-cards
        title: Climate Details
        defaultOpen: false
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.portable_split_air_conditioner_hvac_mode
                primary: HVAC Mode
                secondary: >-
                  {%- set value = states('sensor.portable_split_air_conditioner_hvac_mode') -%}
                  {%- if value in ['unknown', 'unavailable', 'none', 'None', ''] -%}
                    Unavailable
                  {%- else -%}
                    {{ value | replace('_', ' ') | title }}
                  {%- endif -%}
                icon: mdi:air-conditioner
                icon_color: >-
                  {%- set value = states('sensor.portable_split_air_conditioner_hvac_mode') | lower -%}
                  {%- if value == 'cool' -%}
                    blue
                  {%- elif value == 'off' -%}
                    grey
                  {%- else -%}
                    orange
                  {%- endif -%}
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: select.portable_split_air_conditioner_fan_speed_control
                primary: Fan Mode
                secondary: >-
                  {%- set value = states('select.portable_split_air_conditioner_fan_speed_control') -%}
                  {%- if value in ['unknown', 'unavailable', 'none', 'None', ''] -%}
                    Unavailable
                  {%- else -%}
                    {{ value | title }}
                  {%- endif -%}
                icon: mdi:fan
                icon_color: >-
                  {%- set value = states('select.portable_split_air_conditioner_fan_speed_control') | lower -%}
                  {%- if value == 'off' -%}
                    grey
                  {%- elif value == 'silent' -%}
                    cyan
                  {%- elif value == 'low' -%}
                    light-blue
                  {%- elif value == 'mid' -%}
                    blue
                  {%- elif value == 'high' -%}
                    orange
                  {%- elif value == 'turbo' -%}
                    red
                  {%- else -%}
                    grey
                  {%- endif -%}
                tap_action:
                  action: more-info
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.portable_split_air_conditioner_current_temperature
                primary: Current Temp
                secondary: >-
                  {%- set value = states('sensor.portable_split_air_conditioner_current_temperature') -%}
                  {%- if value in ['unknown', 'unavailable', 'none', 'None', ''] -%}
                    Unavailable
                  {%- else -%}
                    {{ value | float(0) | round(1) }} °C
                  {%- endif -%}
                icon: mdi:thermometer
                icon_color: cyan
                tap_action:
                  action: fire-dom-event
                  browser_mod:
                    service: browser_mod.popup
                    data:
                      title: Current Temperature
                      content:
                        type: custom:decluttering-card
                        template: last_7_days_apexcharts_card
                        variables:
                          - entity: sensor.portable_split_air_conditioner_current_temperature
                          - title: Air Conditioner Current Temperature
                          - unit: °C
                          - float_precision: 1
                          - group_by_func: avg
                          - group_by_duration: 10min
                          - color_today: "#4682B4"
                          - color_1day_ago: "#6B91B0"
                          - color_2days_ago: "#7796AF"
                          - color_3days_ago: "#839BAE"
                          - color_4days_ago: "#8FA0AC"
                          - color_5days_ago: "#9BA5AA"
                          - color_6days_ago: "#A7AAA8"
                          - yaxis:
                              - min: ~16
                                max: ~30
                                decimals: 1
                                align_to: 2
                                apex_config:
                                  tickAmount: 5
                                  forceNiceScale: true
                hold_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.split_ac_outside_temperature
                primary: Outside Temp
                secondary: >-
                  {%- set value = states('sensor.split_ac_outside_temperature') -%}
                  {%- if value in ['unknown', 'unavailable', 'none', 'None', ''] -%}
                    Unavailable
                  {%- else -%}
                    {{ value | float(0) | round(1) }} °C
                  {%- endif -%}
                icon: mdi:thermometer
                icon_color: cyan
                tap_action:
                  action: fire-dom-event
                  browser_mod:
                    service: browser_mod.popup
                    data:
                      title: Outside Temperature
                      content:
                        type: custom:decluttering-card
                        template: last_7_days_apexcharts_card
                        variables:
                          - entity: sensor.split_ac_outside_temperature
                          - title: Air Conditioner Outside Temperature
                          - unit: °C
                          - float_precision: 1
                          - group_by_func: avg
                          - group_by_duration: 10min
                          - color_today: "#00ACC1"
                          - color_1day_ago: "#31B1BE"
                          - color_2days_ago: "#4BB4BA"
                          - color_3days_ago: "#62B5B5"
                          - color_4days_ago: "#76B5B0"
                          - color_5days_ago: "#89B3AA"
                          - color_6days_ago: "#9AAFA5"
                          - yaxis:
                              - min: ~16
                                max: ~30
                                decimals: 1
                                align_to: 2
                                apex_config:
                                  tickAmount: 5
                                  forceNiceScale: true
                hold_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: number.portable_split_air_conditioner_target_temperature_control
                primary: Target Temperature
                secondary: >-
                  {%- set value = states('number.portable_split_air_conditioner_target_temperature_control') -%}
                  {%- if value in ['unknown', 'unavailable', 'none', 'None', ''] -%}
                    Unavailable
                  {%- else -%}
                    {{ value | float(0) | round(1) }} °C
                  {%- endif -%}
                icon: mdi:thermometer-chevron-up
                icon_color: orange
                tap_action:
                  action: fire-dom-event
                  browser_mod:
                    service: browser_mod.popup
                    data:
                      title: Target Temp
                      content:
                        type: custom:decluttering-card
                        template: last_7_days_apexcharts_card
                        variables:
                          - entity: number.portable_split_air_conditioner_target_temperature_control
                          - title: Air Conditioner Target Temperature
                          - unit: °C
                          - float_precision: 1
                          - group_by_func: last
                          - group_by_duration: 10min
                          - color_today: "#FF8C32"
                          - color_1day_ago: "#E5904D"
                          - color_2days_ago: "#D09562"
                          - color_3days_ago: "#BE9974"
                          - color_4days_ago: "#AF9D84"
                          - color_5days_ago: "#A3A094"
                          - color_6days_ago: "#9DA19E"
                          - yaxis:
                              - min: ~16
                                max: ~30
                                decimals: 1
                                align_to: 2
                                apex_config:
                                  tickAmount: 5
                                  forceNiceScale: true
                          - apex_config:
                              chart:
                                height: 320px
                              legend:
                                show: false
                              grid:
                                borderColor: rgba(255, 255, 255, 0.08)
                              tooltip:
                                shared: true
                              stroke:
                                curve: stepline
                hold_action:
                  action: more-info
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: switch.plug_air_conditioner_switch
                primary: Mains
                secondary: >-
                  {%- if is_state('switch.plug_air_conditioner_switch', 'on') -%}
                    On
                  {%- elif is_state('switch.plug_air_conditioner_switch', 'off') -%}
                    Off
                  {%- else -%}
                    Unavailable
                  {%- endif -%}
                icon: >-
                  {%- if is_state('switch.plug_air_conditioner_switch', 'on') -%}
                    mdi:power-plug
                  {%- else -%}
                    mdi:power-plug-off
                  {%- endif -%}
                icon_color: >-
                  {%- if is_state('switch.plug_air_conditioner_switch', 'on') -%}
                    green
                  {%- elif is_state('switch.plug_air_conditioner_switch', 'off') -%}
                    red
                  {%- else -%}
                    grey
                  {%- endif -%}
                tap_action:
                  action: toggle
                  confirmation:
                    title: Toggle air conditioner power?
                    text: >-
                      This will toggle mains power to the portable air conditioner.
                    confirm_text: Toggle
                    cancel_text: Cancel
                hold_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.plug_air_conditioner_power
                primary: Power
                secondary: >-
                  {%- set value = states('sensor.plug_air_conditioner_power') -%}
                  {%- if value in ['unknown', 'unavailable', 'none', 'None', ''] -%}
                    Unavailable
                  {%- else -%}
                    {{ value | float(0) | round(0) | int }} W
                  {%- endif -%}
                icon: mdi:flash
                icon_color: >-
                  {%- set state = states('sensor.plug_air_conditioner_power') -%}
                  {%- set value = state | float(0) -%}
                  {%- if state in ['unknown', 'unavailable', 'none', 'None', ''] -%}
                    grey
                  {%- elif value < 10 -%}
                    grey
                  {%- elif value < 500 -%}
                    green
                  {%- elif value < 1200 -%}
                    orange
                  {%- else -%}
                    red
                  {%- endif -%}
                tap_action:
                  action: fire-dom-event
                  browser_mod:
                    service: browser_mod.popup
                    data:
                      title: Air Conditioner Power
                      content:
                        type: custom:decluttering-card
                        template: last_7_days_apexcharts_card
                        variables:
                          - entity: sensor.plug_air_conditioner_power
                          - title: Air Conditioner Power
                          - unit: W
                          - float_precision: 0
                          - transform: "return Math.round(x);"
                          - group_by_func: avg
                          - group_by_duration: 10min
                          - color_today: "#00ACC1"
                          - color_1day_ago: "#31B1BE"
                          - color_2days_ago: "#4BB4BA"
                          - color_3days_ago: "#62B5B5"
                          - color_4days_ago: "#76B5B0"
                          - color_5days_ago: "#89B3AA"
                          - color_6days_ago: "#9AAFA5"
                          - yaxis:
                              - min: 0
                                max: ~2000
                                decimals: 0
                                align_to: 500
                                apex_config:
                                  tickAmount: 4
                                  forceNiceScale: true
                hold_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.plug_air_conditioner_energy_today
                primary: Energy Today
                secondary: >-
                  {%- set value = states('sensor.plug_air_conditioner_energy_today') -%}
                  {%- if value in ['unknown', 'unavailable', 'none', 'None', ''] -%}
                    Unavailable
                  {%- else -%}
                    {{ value | float(0) | round(2) }} kWh
                  {%- endif -%}
                icon: mdi:lightning-bolt
                icon_color: >-
                  {%- set state = states('sensor.plug_air_conditioner_energy_today') -%}
                  {%- set value = state | float(0) -%}
                  {%- if state in ['unknown', 'unavailable', 'none', 'None', ''] -%}
                    grey
                  {%- elif value < 1 -%}
                    teal
                  {%- elif value < 2 -%}
                    green
                  {%- elif value < 4 -%}
                    lime
                  {%- elif value < 6 -%}
                    yellow
                  {%- elif value < 8 -%}
                    orange
                  {%- else -%}
                    red
                  {%- endif -%}
                tap_action:
                  action: fire-dom-event
                  browser_mod:
                    service: browser_mod.popup
                    data:
                      title: Air Conditioner Energy
                      content:
                        type: custom:decluttering-card
                        template: energy_bar_graph_card
                        variables:
                          - name: Air Conditioner Energy
                          - entity: sensor.plug_air_conditioner_energy_today
                          - upper_bound: ~10
                          - graph_span: 14d
                          - graph_span_offset: -13d
                          - unit: kWh
                          - float_precision: 2
                          - graph_color_thresholds:
                              - value: 0
                                color: "#00BFA5"
                              - value: 0.5
                                color: "#00C990"
                              - value: 1
                                color: "#00D47A"
                              - value: 1.5
                                color: "#16D860"
                              - value: 2
                                color: "#42D645"
                              - value: 2.5
                                color: "#72D230"
                              - value: 3
                                color: "#A6CE28"
                              - value: 3.5
                                color: "#D3CE24"
                              - value: 4
                                color: "#F5D523"
                              - value: 5
                                color: "#FFC41F"
                              - value: 6
                                color: "#FFAA1A"
                              - value: 7
                                color: "#FF8618"
                              - value: 8
                                color: "#FF5F1F"
                              - value: 9
                                color: "#C52920"
                              - value: 10
                                color: "#641416"
                hold_action:
                  action: more-info

  #Thermostat Cards
  - type: grid
    columns: 3
    cards:
      - type: thermostat
        entity: climate.badkamer
      - type: thermostat
        entity: climate.studeerkamer
      - type: thermostat
        entity: climate.tamara
      - type: thermostat
        entity: climate.woonkamer
      - type: thermostat
        entity: climate.logeerkamer
      - type: thermostat
        entity: climate.slaapkamer
      - type: thermostat
        entity: climate.babykamer

  - type: custom:apexcharts-card
    graph_span: 24h
    span:
      start: day
    header:
      show: true
      title: Climate Room Temperatures Today vs Yesterday
      show_states: true
      colorize_states: true
    now:
      show: true
    apex_config:
      legend:
        show: false
    update_interval: 1m
    yaxis:
      - min: 14
        max: 26
        decimals: 0
        align_to: 2
        # apex_config:
        #   tickAmount: 5
        #   forceNiceScale: false
    all_series_config:
      attribute: current_temperature
      stroke_width: 2
      float_precision: 1
      unit: °C
      group_by:
        func: avg
        duration: 10min
    series:
      - entity: climate.badkamer
        name: Bathroom - Yesterday
        color: '#FFCE56'
        offset: '-1d'
        opacity: 0.35
        stroke_dash: 4
        show:
          in_header: false
      - entity: climate.badkamer
        name: Bathroom
        color: '#FFCE56'
        extend_to: now
        stroke_width: 4

      - entity: climate.studeerkamer
        name: Study - Yesterday
        color: '#32CD32'
        offset: '-1d'
        opacity: 0.35
        stroke_dash: 4
        show:
          in_header: false
      - entity: climate.studeerkamer
        name: Study
        color: '#32CD32'
        extend_to: now
        stroke_width: 4

      - entity: climate.tamara
        name: Tamara - Yesterday
        color: '#00CED1'
        offset: '-1d'
        opacity: 0.35
        stroke_dash: 4
        show:
          in_header: false
      - entity: climate.tamara
        name: Tamara
        color: '#00CED1'
        extend_to: now
        stroke_width: 4

      - entity: climate.woonkamer
        name: Living Room - Yesterday
        color: '#FF6347'
        offset: '-1d'
        opacity: 0.35
        stroke_dash: 4
        show:
          in_header: false
      - entity: climate.woonkamer
        name: Living Room
        color: '#FF6347'
        extend_to: now
        stroke_width: 4

      - entity: climate.logeerkamer
        name: Guest Room - Yesterday
        color: '#FFD700'
        offset: '-1d'
        opacity: 0.35
        stroke_dash: 4
        show:
          in_header: false
      - entity: climate.logeerkamer
        name: Guest Room
        color: '#FFD700'
        extend_to: now
        stroke_width: 4

      - entity: climate.slaapkamer
        name: Bedroom - Yesterday
        color: '#4682B4'
        offset: '-1d'
        opacity: 0.35
        stroke_dash: 4
        show:
          in_header: false
      - entity: climate.slaapkamer
        name: Bedroom
        color: '#4682B4'
        extend_to: now
        stroke_width: 4

      - entity: climate.babykamer
        name: Baby Room - Yesterday
        color: '#FF69B4'
        offset: '-1d'
        opacity: 0.35
        stroke_dash: 4
        show:
          in_header: false
      - entity: climate.babykamer
        name: Baby Room
        color: '#FF69B4'
        extend_to: now
        stroke_width: 4

  - type: custom:decluttering-card
    template: climate_apexchart
    variables:
      - title: Tamara
      - entity: climate.tamara
      - valve: binary_sensor.verdeler_2de_verdieping_1
      - color_yesterday: '#9300A9'
      - color_today: '#B10DC9'
  - type: custom:decluttering-card
    template: climate_apexchart
    variables:
      - title: Woonkamer
      - entity: climate.woonkamer
      - valve: binary_sensor.verdeler_bg_1
      - color_yesterday: '#C00026'
      - color_today: '#FF4136'
  - type: custom:decluttering-card
    template: climate_apexchart
    variables:
      - title: Logeerkamer
      - entity: climate.logeerkamer
      - valve: binary_sensor.verdeler_2de_verdieping_4
      - color_yesterday: '#008B8B'
      - color_today: '#39CCCC'
  - type: custom:decluttering-card
    template: climate_apexchart
    variables:
      - title: Slaapkamer
      - entity: climate.slaapkamer
      - valve: binary_sensor.verdeler_verdieping_2
      - color_yesterday: '#C46310'
      - color_today: '#FF851B'
  - type: custom:decluttering-card
    template: climate_apexchart
    variables:
      - title: Babykamer
      - entity: climate.babykamer
      - valve: binary_sensor.verdeler_verdieping_1
      - color_yesterday: '#C4A000'
      - color_today: '#FFDC00'
  - type: custom:decluttering-card
    template: climate_apexchart
    variables:
      - title: Studeerkamer
      - entity: climate.studeerkamer
      - valve: binary_sensor.verdeler_2de_verdieping_2
