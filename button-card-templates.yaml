usw_poe_port_power:
  show_icon: false
  show_name: true
  show_state: false
  tap_action:
    action: more-info
  hold_action:
    action: more-info

  custom_fields:
    port: |
      [[[
        const value = Number(entity?.state);
        const unavailable = !entity || ['unknown', 'unavailable', 'none'].includes(entity.state);
        const active = Number.isFinite(value) && value > 0.05;

        const watts = unavailable
          ? '—'
          : `${value.toFixed(value >= 10 ? 0 : 1)} W`;

        return `
          <div class="rj45 ${active ? 'active' : 'inactive'} ${unavailable ? 'unavailable' : ''}">
            <div class="clip"></div>
            <div class="pins">
              <span></span><span></span><span></span><span></span>
              <span></span><span></span><span></span><span></span>
            </div>
            <div class="power">${watts}</div>
          </div>
        `;
      ]]]

  styles:
    grid:
      - grid-template-areas: '"n" "port"'
      - grid-template-columns: 1fr
      - grid-template-rows: min-content 1fr
      - row-gap: 4px
    card:
      - padding: 6px
      - border-radius: 10px
      - background: rgba(var(--rgb-card-background-color), 0.65)
      - border: 1px solid rgba(255,255,255,0.08)
      - box-shadow: none
      - min-height: 76px
    name:
      - font-size: 0.72em
      - font-weight: 700
      - justify-self: center
      - color: var(--secondary-text-color)
    custom_fields:
      port:
        - justify-self: center
        - align-self: center

  extra_styles: |
    .rj45 {
      position: relative;
      width: 46px;
      height: 36px;
      border-radius: 5px 5px 8px 8px;
      border: 2px solid rgba(160,160,160,0.55);
      background:
        linear-gradient(180deg, rgba(20,20,20,0.95), rgba(55,55,55,0.75));
      box-shadow:
        inset 0 2px 3px rgba(255,255,255,0.10),
        inset 0 -3px 5px rgba(0,0,0,0.55);
    }

    .rj45.active {
      border-color: rgba(76, 175, 80, 0.95);
      box-shadow:
        0 0 8px rgba(76, 175, 80, 0.55),
        inset 0 2px 3px rgba(255,255,255,0.12),
        inset 0 -3px 5px rgba(0,0,0,0.55);
    }

    .rj45.inactive {
      border-color: rgba(120,120,120,0.45);
      opacity: 0.72;
    }

    .rj45.unavailable {
      border-color: rgba(244,67,54,0.7);
      opacity: 0.45;
    }

    .clip {
      position: absolute;
      top: -2px;
      left: 13px;
      width: 20px;
      height: 7px;
      border-radius: 0 0 4px 4px;
      background: rgba(0,0,0,0.8);
      border-left: 1px solid rgba(255,255,255,0.12);
      border-right: 1px solid rgba(255,255,255,0.12);
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .pins {
      position: absolute;
      top: 8px;
      left: 6px;
      right: 6px;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 2px;
    }

    .pins span {
      height: 7px;
      border-radius: 1px;
      background: rgba(255, 193, 7, 0.85);
      box-shadow: 0 0 3px rgba(255, 193, 7, 0.45);
    }

    .power {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 4px;
      text-align: center;
      font-size: 0.66em;
      font-weight: 700;
      line-height: 1;
      color: rgba(255,255,255,0.92);
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

unifi_link_speed_port:
  show_icon: false
  show_name: true
  show_state: false

  variables:
    speed_entity: ""
    port_type: rj45

  tap_action:
    action: >-
      [[[
        return states[variables.speed_entity] ? 'more-info' : 'none';
      ]]]
    entity: >-
      [[[
        return variables.speed_entity;
      ]]]

  hold_action:
    action: >-
      [[[
        return states[variables.speed_entity] ? 'more-info' : 'none';
      ]]]
    entity: >-
      [[[
        return variables.speed_entity;
      ]]]

  custom_fields:
    port: |
      [[[
        const stateObj = states[variables.speed_entity];
        const raw = stateObj?.state;
        const speed = Number(raw);
        const disconnected =
          !stateObj ||
          raw === undefined ||
          ['unknown', 'unavailable', 'none', 'None', ''].includes(String(raw));

        let label = '—';
        let speedClass = 'disconnected';

        if (!disconnected && Number.isFinite(speed) && speed > 0) {
          if (speed >= 10000) {
            label = '10G';
            speedClass = 'speed-10g';
          } else if (speed >= 2500) {
            label = '2.5G';
            speedClass = 'speed-25g';
          } else if (speed >= 1000) {
            label = '1G';
            speedClass = 'speed-1g';
          } else if (speed >= 100) {
            label = '100M';
            speedClass = 'speed-100m';
          } else {
            label = `${speed}M`;
            speedClass = 'speed-low';
          }
        }

        const typeClass = variables.port_type === 'sfp' ? 'sfp' : 'rj45';

        return `
          <div class="port ${typeClass} ${speedClass}">
            <div class="clip"></div>
            <div class="pins">
              <span></span><span></span><span></span><span></span>
              <span></span><span></span><span></span><span></span>
            </div>
            <div class="speed">${label}</div>
          </div>
        `;
      ]]]

  styles:
    grid:
      - grid-template-areas: '"n" "port"'
      - grid-template-columns: 1fr
      - grid-template-rows: min-content 1fr
      - row-gap: 4px

    card:
      - padding: 6px
      - border-radius: 10px
      - background: rgba(var(--rgb-card-background-color), 0.65)
      - border: 1px solid rgba(255,255,255,0.08)
      - box-shadow: none
      - min-height: 76px

    name:
      - font-size: 0.72em
      - font-weight: 700
      - justify-self: center
      - color: var(--secondary-text-color)

    custom_fields:
      port:
        - justify-self: center
        - align-self: center

  extra_styles: |
    .port {
      position: relative;
      width: 46px;
      height: 36px;
      border-radius: 5px 5px 8px 8px;
      border: 2px solid rgba(120,120,120,0.45);
      background:
        linear-gradient(180deg, rgba(20,20,20,0.95), rgba(55,55,55,0.75));
      box-shadow:
        inset 0 2px 3px rgba(255,255,255,0.10),
        inset 0 -3px 5px rgba(0,0,0,0.55);
      opacity: 0.72;
    }

    .port.rj45 .clip {
      position: absolute;
      top: -2px;
      left: 13px;
      width: 20px;
      height: 7px;
      border-radius: 0 0 4px 4px;
      background: rgba(0,0,0,0.8);
      border-left: 1px solid rgba(255,255,255,0.12);
      border-right: 1px solid rgba(255,255,255,0.12);
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .port.sfp {
      border-radius: 4px;
      background:
        linear-gradient(180deg, rgba(10,10,10,0.95), rgba(35,35,35,0.85));
    }

    .port.sfp .clip {
      position: absolute;
      top: 5px;
      left: 7px;
      right: 7px;
      height: 5px;
      border-radius: 2px;
      background: rgba(255,255,255,0.10);
    }

    .pins {
      position: absolute;
      top: 8px;
      left: 6px;
      right: 6px;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 2px;
    }

    .port.sfp .pins {
      display: none;
    }

    .pins span {
      height: 7px;
      border-radius: 1px;
      background: rgba(255, 193, 7, 0.85);
      box-shadow: 0 0 3px rgba(255, 193, 7, 0.45);
    }

    .speed {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 4px;
      text-align: center;
      font-size: 0.66em;
      font-weight: 800;
      line-height: 1;
      color: rgba(255,255,255,0.94);
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    .speed-10g {
      opacity: 1;
      border-color: rgba(156, 39, 176, 0.95);
      box-shadow:
        0 0 8px rgba(156, 39, 176, 0.65),
        inset 0 2px 3px rgba(255,255,255,0.12),
        inset 0 -3px 5px rgba(0,0,0,0.55);
    }

    .speed-25g {
      opacity: 1;
      border-color: rgba(3, 169, 244, 0.95);
      box-shadow:
        0 0 8px rgba(3, 169, 244, 0.60),
        inset 0 2px 3px rgba(255,255,255,0.12),
        inset 0 -3px 5px rgba(0,0,0,0.55);
    }

    .speed-1g {
      opacity: 1;
      border-color: rgba(76, 175, 80, 0.95);
      box-shadow:
        0 0 8px rgba(76, 175, 80, 0.55),
        inset 0 2px 3px rgba(255,255,255,0.12),
        inset 0 -3px 5px rgba(0,0,0,0.55);
    }

    .speed-100m {
      opacity: 1;
      border-color: rgba(255, 152, 0, 0.95);
      box-shadow:
        0 0 8px rgba(255, 152, 0, 0.55),
        inset 0 2px 3px rgba(255,255,255,0.12),
        inset 0 -3px 5px rgba(0,0,0,0.55);
    }

    .speed-low {
      opacity: 1;
      border-color: rgba(244, 67, 54, 0.95);
      box-shadow:
        0 0 8px rgba(244, 67, 54, 0.55),
        inset 0 2px 3px rgba(255,255,255,0.12),
        inset 0 -3px 5px rgba(0,0,0,0.55);
    }

    .disconnected {
      border-color: rgba(120,120,120,0.35);
      opacity: 0.42;
      filter: g


# Templates for the Server overview tab
# Templates used only by the redesigned server tab.
server_status:
  show_state: false
  show_label: true
  variables:
    a_key: ''
    a_usage: ''
    b_helpers: |-
      [[[
      const s = id => hass.states[id]?.state;
      const known = id => s(id) != null && !['unknown','unavailable','none','None',''].includes(s(id));
      const n = id => known(id) && Number.isFinite(Number(s(id))) ? Number(s(id)) : null;
      const attr = (id, key) => hass.states[id]?.attributes?.[key];
      const binary = id => ['on','off'].includes(s(id));
      const fmt = (v, digits=0, unit='') => v == null ? '—' : `${v.toFixed(digits)}${unit}`;
      const health = (summary, color='green') => ({summary, color});
      return {s,known,n,attr,binary,fmt,health};
      ]]]
    c_health:
      summary: Unavailable
      color: disabled
  label: |-
    [[[
    return variables.c_health.summary;
    ]]]
  color: |-
    [[[
    return variables.c_health.color;
    ]]]
  styles:
    grid:
    - grid-template-areas: '"i n" "i l"'
    - grid-template-columns: 34px minmax(0, 1fr)
    - column-gap: 8px
    card:
    - padding: 12px
    - min-height: 86px
    - text-align: left
    - border-radius: var(--ha-card-border-radius, 12px)
    icon:
    - width: 28px
    - color: |-
        [[[
        return variables.c_health.color === 'disabled' ? 'var(--disabled-text-color)' : `var(--${variables.c_health.color === 'green' ? 'success' : variables.c_health.color === 'red' ? 'error' : variables.c_health.color === 'amber' ? 'warning' : 'info'}-color)`;
        ]]]
    name:
    - justify-self: start
    - font-size: 14px
    - font-weight: '500'
    - white-space: normal
    label:
    - justify-self: start
    - font-size: 12px
    - color: var(--secondary-text-color)
    - white-space: pre-line
    - line-height: '1.45'
  extra_styles: |2

    ha-card { transition: background-color .15s ease; }
    ha-card:hover { background: var(--secondary-background-color); }
    ha-card:focus-visible { outline: 2px solid var(--primary-color); }
server_disk:
  template: server_status
  variables:
    c_health: |-
      [[[
      const h=variables.b_helpers, k=variables.a_key;
      const health=`binary_sensor.tower_disk_${k}_health`, temp=`sensor.tower_disk_${k}_temperature`;
      const spin=`switch.tower_disk_${k}_spin`;
      const spinning=k==='cache' ? true : h.s(spin)==='on';
      const standby=k!=='cache' && h.s(spin)==='off';
      const t=standby ? null : h.n(temp);
      const u=k==='parity' ? null : h.n(variables.a_usage);
      let summary=k==='parity' ? `${h.fmt(t,0)} °C · ${standby?'Standby':spinning?'Spinning':'Spin state unknown'}` : `${h.fmt(u,1,'%')} · ${h.fmt(t,0)} °C`;
      if(k!=='parity') summary += `\n${standby?'Standby':spinning?'Active':'Spin state unknown'}`;
      if(h.s(health)==='on') return h.health('Health problem\n'+summary,'red');
      if(k!=='parity' && (h.n(`sensor.tower_disk_${k}_errors`) || 0)>0) return h.health('Read/write errors\n'+summary,'red');
      if(!h.binary(health)) return h.health('Health unavailable\n'+summary,'disabled');
      if(k!=='parity' && u==null) return h.health('Usage unavailable\n'+summary,'disabled');
      if(u!=null && u >= 90) return h.health(summary,'red');
      if(u!=null && u >= (k==='cache'?75:80)) return h.health(summary,'amber');
      if(!standby && t==null) return h.health(summary,'amber');
      if(t!=null && t>=55) return h.health(summary,'red');
      if(t!=null && t>=45) return h.health(summary,'amber');
      return h.health(summary);
      ]]]
server_container:
  template: server_status
  show_entity_picture: true
  entity_picture: |-
    [[[
    return entity?.attributes?.icon_url || undefined;
    ]]]
  styles:
    entity_picture:
    - width: 28px
    - height: 28px
    - object-fit: contain
  variables:
    c_health: |-
      [[[
      const h=variables.b_helpers, k=variables.a_key;
      const cpu=h.n(`sensor.docker_tower_${k}_cpu`), mem=h.n(`sensor.docker_tower_${k}_memory`);
      const unit=h.attr(`sensor.docker_tower_${k}_memory`,'unit_of_measurement');
      const bytes=mem == null ? null : mem * ({B:1,kB:1000,KB:1000,MB:1e6,GB:1e9,KiB:1024,MiB:1048576,GiB:1073741824}[unit] || NaN);
      const ram=Number.isFinite(bytes) ? (bytes>=1073741824 ? (bytes/1073741824).toFixed(2)+' GiB' : (bytes/1048576).toFixed(0)+' MiB') : '—';
      const state=entity?.state;
      return h.health(`${state==='on'?'Running':state==='off'?'Stopped':'Unavailable'}\nCPU ${h.fmt(cpu,1,'%')} · RAM ${ram}`, state==='on'?'green':'disabled');
      ]]]
